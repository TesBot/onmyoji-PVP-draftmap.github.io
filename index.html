/* ---------------- 导出 3：PNG 图片（导图 + 下方拼接式神配置表）----------------
   思路：不截图，直接用现成的布局数据重画。
   · 连线直接复用 #wires 里已经算好的 path（Path2D 吃同一套 d 字符串）；
   · 节点 / 文字 / 头像的位置与样式从活着的 DOM 元素上量（offset* / getComputedStyle），
     所以就算改了主题、字号、头像大小，导出的图也跟着一样。 */
function visibleInsts(){
  const out = [];
  const seen = {};
  for(const r of ROOTS) (function w(n){
    if(!n.el || n.el.style.display === 'none') return;
    if(seen[n.uid]) return; seen[n.uid] = 1;
    out.push(n);
    for(const c of n.children) w(c);
  })(r);
  return out;
}
function cssFont(el){
  const s = getComputedStyle(el);
  return (s.fontStyle + ' ' + s.fontWeight + ' ' + s.fontSize + ' ' + s.fontFamily).trim();
}
/* 按 container 内可用宽度折行：CJK 逐字断，连续的英文 / 数字当一个词不断开 */
function wrapText(ctx, text, maxW){
  const src = String(text == null ? '' : text);
  if(!src) return [];
  const toks = src.match(/[A-Za-z0-9_.+\-%]+|\s+|[\s\S]/g) || [src];
  const lines = []; let cur = '';
  for(const tk of toks){
    const probe = cur + tk;
    if(cur && ctx.measureText(probe).width > maxW && !/^\s+$/.test(tk)){
      lines.push(cur); cur = /^\s+$/.test(tk) ? '' : tk;
    }else cur = probe;
  }
  if(cur !== '') lines.push(cur);
  return lines.length ? lines : [''];
}
function rrect(ctx, x, y, w, h, r){
  const k = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + k, y);
  ctx.arcTo(x + w, y, x + w, y + h, k);
  ctx.arcTo(x + w, y + h, x, y + h, k);
  ctx.arcTo(x, y + h, x, y, k);
  ctx.arcTo(x, y, x + w, y, k);
  ctx.closePath();
}
/* 从活的 DOM 元素上量出一张结点的画法（相对自己左上角的偏移，全部是未缩放的布局像素） */
function measureNode(inst){
  const el = inst.el;
  const info = {
    x: inst.x, y: inst.y, w: el.offsetWidth, h: el.offsetHeight,
    box: {bg: getComputedStyle(el).backgroundColor, bd: getComputedStyle(el).borderColor,
          bw: parseFloat(getComputedStyle(el).borderTopWidth) || 1,
          r: parseFloat(getComputedStyle(el).borderTopLeftRadius) || 0},
    padX: parseFloat(getComputedStyle(el).paddingLeft) || 0,
    padT: parseFloat(getComputedStyle(el).paddingTop) || 0,
    items: [], badge: null, mgbadge: null
  };
  for(const ch of el.children){
    const cs = getComputedStyle(ch);
    if(ch.classList.contains('badge') || ch.classList.contains('mgbadge')){
      info[ch.classList.contains('badge') ? 'badge' : 'mgbadge'] = {
        txt: ch.textContent, x: ch.offsetLeft, y: ch.offsetTop,
        w: ch.offsetWidth, h: ch.offsetHeight, bg: cs.backgroundColor, fg: cs.color,
        bd: cs.borderColor, fs: parseFloat(cs.fontSize) || 11
      };
      continue;
    }
    if(ch.classList.contains('txt')){
      info.items.push({k: 'txt', x: ch.offsetLeft, y: ch.offsetTop, w: ch.offsetWidth,
                       lines: null, text: ch.textContent, font: cssFont(ch),
                       fg: cs.color, lh: parseFloat(cs.lineHeight) || parseFloat(cs.fontSize) * 1.4});
      continue;
    }
    if(ch.classList.contains('avs')){
      for(const im of ch.children){
        if(im.tagName === 'IMG'){
          info.items.push({k: 'av', x: im.offsetLeft, y: im.offsetTop,
                           sw: im.offsetWidth, sh: im.offsetHeight, src: im.currentSrc || im.src,
                           nm: im.alt});        // alt 就是式神名，优先走头像包取 dataURL（file:// 也能画出来）
        }else{
          info.items.push({k: 'miss', x: im.offsetLeft, y: im.offsetTop, sw: im.offsetWidth,
                           sh: im.offsetHeight, txt: im.textContent, bd: cs.borderColor,
                           bg: cs.backgroundColor, fg: cs.color,
                           fs: Math.round((parseFloat(cs.fontSize) || 13))});
        }
      }
      continue;
    }
    if(ch.classList.contains('yh')){
      for(const c of ch.children){
        const ls = getComputedStyle(c);
        info.items.push({k: 'chip', x: c.offsetLeft, y: c.offsetTop, w: c.offsetWidth, h: c.offsetHeight,
                         txt: c.textContent, bg: ls.backgroundColor, fg: ls.color, font: cssFont(c),
                         r: parseFloat(ls.borderTopLeftRadius) || 10});
      }
      continue;
    }
    if(ch.classList.contains('refmark')){
      info.items.push({k: 'note', x: ch.offsetLeft, y: ch.offsetTop, w: ch.offsetWidth,
                       txt: ch.textContent, fg: cs.color, font: cssFont(ch), lh: parseFloat(cs.lineHeight)});
    }
  }
  return info;
}
async function loadImg(src){
  if(!src) return null;
  if(/^data:/.test(src)){
    return new Promise(res=>{ const im = new Image(); im.onload = ()=> res(im); im.onerror = ()=> res(null);
      im.src = src; });
  }
  return await new Promise(res=>{
    let outed = false;
    const done = v=>{ if(outed) return; outed = true; res(v); };
    try{
      fetch(src)                                  // 先转 data URL，避免污染画布导致导出失败
        .then(r=> r.ok ? r.blob() : Promise.reject(new Error('http ' + r.status)))
        .then(b=> new Promise((ok, no)=>{ const fr = new FileReader();
          fr.onload = ()=> ok(fr.result); fr.onerror = no; fr.readAsDataURL(b); }))
        .then(d=>{ const im = new Image(); im.onload = ()=> done(im); im.onerror = ()=> done(null); im.src = d; })
        .catch(()=> done(null));
    }catch(e){ done(null); }
  });
}
/* 先框出「图上有多大」，再决定画布尺寸：ROWS 之后拼式神配置表 */
async function measureSheetTable(ctx, sc){
  const rows = sc.sheet ? sc.sheet.rows : [];
  if(!rows.length) return null;
  const heads = ['序号'].concat(sc.sheet.headers);
  const imgs = {};
  const fonts = {};
  const stage = document.getElementById('stage');
  const cellStyle = {};
  const tb = document.querySelector('#sheetBody table');
  const refTh = tb && tb.querySelector('thead th:nth-child(2)');
  const refTd = tb && tb.querySelector('tbody td:nth-child(2)');
  if(refTh){ const s = getComputedStyle(refTh);
    cellStyle.th = {font: cssFont(refTh), fg: s.color, bg: s.backgroundColor, bd: s.borderColor, pad: 8}; }
  if(refTd){ const s = getComputedStyle(refTd);
    cellStyle.td = {font: cssFont(refTd), fg: s.color, bg: s.backgroundColor, bd: s.borderColor, pad: 8}; }
  const th0 = tb && tb.querySelector('thead th');
  if(th0){ const s = getComputedStyle(th0); cellStyle.no = {font: cssFont(th0), fg: s.color, bg: s.backgroundColor}; }
  const useTh = cellStyle.th || {font: '600 13px sans-serif', pad: 8};
  const useTd = cellStyle.td || {font: '13px sans-serif', pad: 8};
  const pad = 8, gap = 6;
  const AV = 26;                                  // 与 CSS 里 table.sheet .av 对齐
  const widths = heads.map((h, i)=>{
    ctx.font = useTh.font;
    return ctx.measureText(h).width + pad * 2;
  });
  for(const row of rows){
    heads.forEach((_, i)=>{
      if(i === 0) return;
      const v = String(row[i - 1] == null ? '' : row[i - 1]);
      ctx.font = useTd.font;
      let w = ctx.measureText(v).width + pad * 2;
      if(i === 1){ const nm = sheetAvatar(row[0]); if(nm){ w += AV + gap; if(!imgs[nm]) imgs[nm] = null; } }
      ctx.font = useTh.font;
      w = Math.max(w, ctx.measureText(heads[i]).width + pad * 2);
      widths[i] = Math.max(widths[i], w);
    });
  }
  widths[0] = Math.max(widths[0], 46);
  for(const nm of Object.keys(imgs)) imgs[nm] = await loadImg(avUrl(avSrc(nm), 0));
  return {heads, rows, widths, pad, gap, av: AV, imgs, style: cellStyle,
          total: widths.reduce((a, b)=> a + b, 0), rowH: AV + pad * 2};
}
/* 导出 PNG：导图在上，式神配置表在下，一次性拼好 */
async function renderSchemePng(sc){

  const insts = visibleInsts();

  let minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;

      }else if(it.k === 'miss'){

        ctx.textAlign = 'left'; ctx.textBaseline = 'top';

      ctx.fill(); ctx.stroke();

      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

      const w = table.widths[ci];
      const st = table.style.th || {};

      ctx.fillRect(x, tbTop + 30, w, H2);
      ctx.strokeStyle = st.bd || 'rgba(0,0,0,.18)'; ctx.lineWidth = 1;
      ctx.strokeRect(x + 0.5, tbTop + 30.5, w - 1, H2);
      ctx.fillStyle = st.fg || '#333'; ctx.font = st.font || '600 13px sans-serif';
      ctx.textAlign = ci === 0 ? 'center' : 'left'; ctx.textBaseline = 'middle';
      const tx0 = ci === 0 ? x + w / 2 : x + table.pad;
      ctx.fillText(table.heads[ci], tx0, tbTop + 30 + H2 / 2);

    table.rows.forEach((row, ri)=>{

        ctx.fillRect(cx, y, w, table.rowH);

  });
  setExpTip('导出当前方案「' + (sc.name || sc.id) + '」。');
  box.classList.add('open');
  // 预查一下头像能不能固化进去（异步，不阻塞面板弹出）：查完把结果补到提示里
  ensureAvatarPack().then(()=>{
    const names = schemeAvatarNames(sc);
    const ready = names.filter(nm => /^data:/.test(avSrc(nm) || '')).length;
    if(!names.length) return;
    setExpTip('本方案用到 ' + names.length + ' 个式神头像，' +
      (ready === names.length ? '已全部就绪（会固化进产物）'
        : '其中 ' + ready + ' 个就绪；其余需要 http 环境才能取到（会退化成占位框）') + '。');
  });
}
function closeExport(){ const b = document.getElementById('expBox'); if(b) b.classList.remove('open'); }
function setExpTip(s){ const t = document.getElementById('expTip'); if(t) t.textContent = s || ''; }
async function runExport(kind, btn){
  const sc = scheme();
  if(!sc){ alert('没有可导出的方案'); return; }
  const base = slug(sc.name || sc.id);
  const opts = document.querySelectorAll('#expOpts .opt');
  opts.forEach(b => b.disabled = true);
  try{
    if(kind === 'json'){
      download(base + '.json', schemeExportJson());
      setExpTip('已导出 ' + base + '.json');
      return closeExport();
    }
    if(kind === 'html'){
      setExpTip('正在把头像固化进文件…');
      const av = await collectAvatarData(sc);
      const missed = schemeAvatarNames(sc).filter(nm => !av[nm]).length;
      const html = buildViewerHtml(sc, av);
      if(!html){ alert('导出失败：没能把方案写进模板'); return; }
      downloadFile(base + '.html', new Blob([html], {type: 'text/html;charset=utf-8'}));
      setExpTip('已导出 ' + base + '.html' +
        (missed ? '（' + missed + ' 张头像没能内联进去，需要 http 环境）' : '（头像已全部内联）'));
      return closeExport();
    }
    if(kind === 'png'){
      setExpTip('正在画图…');
      const r = await renderSchemePng(sc);
      if(!r || !r.canvas){ alert('导出图片失败：' + ((r && r.err) || '画布不可用')); return; }
      const blob = await new Promise(res => r.canvas.toBlob(res, 'image/png'));
      if(!blob){
        setExpTip('导出图片被浏览器拦截了（可能是本地打开导致画布被污染），用 http 方式打开页面再试。');
        return;
      }
      downloadFile(base + '.png', blob);
      setExpTip('已导出 ' + base + '.png（' + r.w + '×' + r.h +
        (r.avFail ? ' · ' + r.avFail + ' 张头像没能内联，建议用 http 方式打开页面再导出' : '') + '）');
      return closeExport();
    }
  }finally{
    opts.forEach(b => b.disabled = false);
  }
}
/* 从 JSON 里取出方案数组：接受 单个方案 / 方案数组 / {schemes:[...]} */
function schemesFromJson(obj){
  const list = Array.isArray(obj) ? obj
             : (obj && Array.isArray(obj.schemes)) ? obj.schemes
             : (obj && obj.nodes) ? [obj] : null;
  if(!list || !list.length || !list.every(s => s && s.nodes)) return null;
  return list;
}
/* 把方案加进来（一律先是自建方案，id 冲突自动改号） */
function addSchemes(rawList){
  let added = 0, lastId = null;
  for(const raw of rawList){
    const sc = JSON.parse(JSON.stringify(raw));
    if(!isObj(sc.nodes) || !Object.keys(sc.nodes).length) continue;
    sc.id = uniqueSchemeId(String(sc.id || 'imported'));
    sc.name = String(sc.name || sc.id);
    sc.builtin = false; delete sc.rev;
    if(!sc.nodes[sc.start]) sc.start = Object.keys(sc.nodes)[0];
    if(!Array.isArray(sc.floating)) sc.floating = [];
    CFG.schemes.push(sc);
    lastId = sc.id; added++;
  }
  if(added){ CFG.activeScheme = lastId; saveLocal(); rebuild(); flashNote(); }
  return added;
}
function importScheme(){
  const i = document.createElement('input');
  i.type = 'file'; i.accept = '.json,application/json';
  i.onchange = ()=>{
    const f = i.files && i.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = ()=>{
      let obj;
      try{ obj = JSON.parse(rd.result); }
      catch(e){ alert('JSON 语法错误：' + e.message); return; }
      const list = schemesFromJson(obj);
      if(!list){ alert('这不是一个方案文件。'); return; }
      if(!addSchemes(list)) alert('文件里没有可用的方案。');
    };
    rd.readAsText(f);
  };
  i.click();
}

function findInst(nid){
  for(const r of ROOTS){
    let f = null;
    (function w(n){ if(f) return; if(n.nid === nid && !n.isRef) f = n; for(const c of n.children) w(c); })(r);
    if(f) return f;
  }
  return null;
}
function reselect(nid){ const inst = findInst(nid); if(inst) selectNode(inst, inst.el); }

/* --- 复用已有节点（建立汇合）--- */
function openPicker(node){
  const sc = scheme();
  sideTitle.textContent = '复用已有节点 → 作为「' + node.title + '」的子节点';
  sideBody.innerHTML = '<div class="fld"><label>搜索节点</label>' +
    '<input id="pk_q" placeholder="输入标题关键字，也可以直接输节点 ID（如 n92）"></div>' +
    '<div id="pk_list"></div>';
  const q = document.getElementById('pk_q'), list = document.getElementById('pk_list');
  function draw(){
    const kw = (q.value || '').trim();
    const items = Object.keys(sc.nodes).filter(id =>
      id !== node.id && (!kw ||
        String(sc.nodes[id].title || '').indexOf(kw) >= 0 || String(id).indexOf(kw) >= 0));
    list.innerHTML = items.length ? '' : '<div class="hint">没有匹配的节点</div>';
    for(const id of items){
      const n = sc.nodes[id];
      const refs = Object.keys(sc.nodes).filter(x => sc.nodes[x].children.indexOf(id) >= 0).length;
      const row = document.createElement('div');
      row.style.cssText = 'display:flex;align-items:center;gap:8px;padding:6px 8px;margin-bottom:6px;' +
        'border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:13px';
      const t = document.createElement('span');
      t.style.cssText = 'flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap';
      t.textContent = n.title;
      const meta = document.createElement('span');
      meta.style.cssText = 'font-size:11px;opacity:.6;flex:0 0 auto';
      meta.textContent = id + (refs ? ' · 已被 ' + refs + ' 处引用' : '');
      row.appendChild(t); row.appendChild(meta);
      row.onclick = ()=>{
        if(node.children.indexOf(id) >= 0){ alert('该节点已经是当前节点的子节点了'); return; }
        node.children.push(id);
        saveLocal(); rebuild(true); reselect(node.id);
      };
      list.appendChild(row);
    }
  }
  q.oninput = draw; draw();
  sideFoot.innerHTML = '';
  footBtn('返回节点编辑', ()=> reselect(node.id));
  footBtn('关闭', ()=>{ if(SEL&&SEL.el) SEL.el.classList.remove('sel'); SEL=null; closeSide(); });
  side.classList.add('open');
}

/* --- 重建 --- */
function rebuild(keepView){
  WARN = [];
  world.innerHTML = '<svg id="wires"></svg><svg id="wiresTop"></svg>';
  svg = document.getElementById('wires');
  svgTop = document.getElementById('wiresTop');
  ROOTS = buildRoots();
  for(const r of ROOTS) mount(r);
  buildToolbar();
  buildSchemeBar();
  renderSheet();
  layout();
  // keepView：改节点内容 / 加子卡 / 复用 这类「原地编辑」不该把镜头搬走（用户明确要求）；
  // 换方案、新建、导入 这些换了另一张图的情况仍然重新适配
  if(keepView) applyView(); else view();
}

/* --- 式神配置表：渲染 + 行内编辑 --- */
function sheetAvatar(name){
  const raw = String(name || '').trim();
  if(!raw) return null;
  for(const nm of expandNames(raw)){
    if(CFG.assets.avatarIndex[nm]) return nm;
    if(CFG.assets.placeholders && CFG.assets.placeholders[nm]) return nm;
  }
  return null;
}
function mkMiss(mark){
  const d = document.createElement('span');
  d.className = 'avm'; d.textContent = mark || CFG.style.missing.mark || '?';
  return d;
}
/* 单元格内容：式神列带 26px 小头像；空值用淡一点的占位 */
function paintCell(td, val, isSS){
  td.innerHTML = '';
  const v = String(val == null ? '' : val);
  if(isSS && v){
    const nm = sheetAvatar(v);
    if(nm && CFG.assets.avatarIndex[nm]){
      const im = document.createElement('img');
      im.className = 'av'; im.alt = nm;
      im.src = avUrl(avSrc(nm), 0);
      im.onerror = function(){ im.replaceWith(mkMiss(CFG.style.missing.mark)); };
      td.appendChild(im);
    }else{
      const d = mkMiss(CFG.style.missing.mark);
      d.title = '未匹配到「' + v + '」的头像（可试试写全名）';
      td.appendChild(d);
    }
  }
  const sp = document.createElement('span');
  sp.textContent = v || '—';
  if(!v) sp.style.opacity = '.35';
  td.appendChild(sp);
}
/* 双击进入编辑：换成 input，回车 / 失焦保存，Esc 取消 */
function editCell(td, row, ci){
  if(td.querySelector('input')) return;
  const old = row[ci] || '';
  td.innerHTML = '';
  const inp = document.createElement('input');
  inp.value = old;
  td.appendChild(inp); inp.focus(); inp.select();
  let done = false;
  const commit = keep=>{
    if(done) return; done = true;
    if(keep) row[ci] = inp.value.trim();
    saveLocal(); renderSheet();
  };
  inp.onblur = ()=> commit(true);
  inp.onkeydown = ev=>{
    ev.stopPropagation();                       // 别让方向键去平移导图
    if(ev.key === 'Enter') commit(true);
    else if(ev.key === 'Escape') commit(false);
  };
}
function renderSheet(){
  const bar = document.getElementById('sheetBar');
  const body = document.getElementById('sheetBody');
  const cnt = document.getElementById('sheetCnt');
  if(!bar || !body) return;
  const sc = scheme();
  body.innerHTML = '';
  if(!sc){ cnt.textContent = ''; syncSheetToggle(); return; }
  if(!sc.sheet) normSheet(sc);            // 兜底：新建 / 外部塞进来的方案可能没有 sheet
  const sh = sc.sheet;
  cnt.textContent = sh.rows.length + ' 行';
  if(!sh.rows.length){
    const d = document.createElement('div');
    d.id = 'sheetEmpty';
    d.innerHTML = READONLY
      ? '这个方案还没有录入式神配置。'
      : '还没录入式神配置。点右上 <kbd>＋ 添加一行</kbd>，依次填：' +
      '<b>式神</b>（支持简称，如「炎魔」）→ <b>指标</b>（速度 / 生命 / 攻击…）→ ' +
      '<b>御魂套装</b>（散件 / 火灵+防御两件套…）→ <b>246号位</b>（速XX / 速生生…）→ ' +
      '<b>其他要求</b>（攻击&gt;4600…）。<br>' +
      '单元格 <kbd>双击</kbd> 改，<kbd>回车</kbd> 保存，行尾 ✕ 删除；这套配置跟着方案一起导出 / 导入。';
    body.appendChild(d);
    syncSheetToggle();
    return;
  }
  const tb = document.createElement('table');
  tb.className = 'sheet';
  const trh = document.createElement('tr');
  const th0 = document.createElement('th'); th0.className = 'no'; th0.textContent = '序号'; trh.appendChild(th0);
  for(const h of sh.headers){ const th = document.createElement('th'); th.textContent = h; trh.appendChild(th); }
  if(!READONLY){                                  // 只读版没有「删除行」这一列
    const thx = document.createElement('th'); thx.style.width = '32px'; trh.appendChild(thx);
  }
  const thead = document.createElement('thead'); thead.appendChild(trh); tb.appendChild(thead);
  const tbody = document.createElement('tbody');
  sh.rows.forEach((row, ri)=>{
    const tr = document.createElement('tr');
    const tdn = document.createElement('td'); tdn.className = 'no'; tdn.textContent = ri + 1; tr.appendChild(tdn);
    sh.headers.forEach((_, ci)=>{
      const td = document.createElement('td');
      td.className = READONLY ? 'view' : 'edit'; td.dataset.ci = ci;
      paintCell(td, row[ci], ci === 0);
      if(!READONLY) td.ondblclick = ()=> editCell(td, row, ci);      // 只读版不给编辑入口
      tr.appendChild(td);
    });
    if(!READONLY){
      const del = document.createElement('td');
      del.className = 'del'; del.textContent = '✕'; del.title = '删除这一行';
      del.onclick = ()=>{ sh.rows.splice(ri, 1); saveLocal(); renderSheet(); };
      tr.appendChild(del);
    }
    tbody.appendChild(tr);
  });
  tb.appendChild(tbody); body.appendChild(tb);
  syncSheetToggle();
}
function addSheetRow(){
  const sc = scheme(); if(!sc) return;
  sc.sheet.rows.push(new Array(sc.sheet.headers.length).fill(''));
  saveLocal();
  SHEET_OPEN = true;            // 加行时自动把抽屉打开
  renderSheet();
  const body = document.getElementById('sheetBody');
  body.scrollTop = body.scrollHeight;
  // 不用复杂选择器（tbody tr:last-child td.edit），逐级取更稳
  const tbody = body.querySelector('table') && body.querySelector('table').querySelector('tbody');
  const lastTr = tbody && tbody.children[tbody.children.length - 1];
  const firstCell = lastTr && lastTr.children[1];                        // 1 = 第一列数据（0 是序号）
  if(firstCell) editCell(firstCell, sc.sheet.rows[sc.sheet.rows.length - 1], 0);
}
/* 配置表只在需要时出现：方案栏按钮带行数徽标，打开时按钮高亮，方便看出「本方案有没有配置」 */
function syncSheetToggle(){
  const bar = document.getElementById('sheetBar');
  if(bar) bar.classList.toggle('open', SHEET_OPEN);
  const t = document.getElementById('sheetToggle');
  if(t) t.textContent = SHEET_OPEN ? '收起 ▾' : '展开 ▴';
  const sc = scheme();
  const n = sc && sc.sheet ? sc.sheet.rows.length : 0;
  if(SHEET_BTN){
    SHEET_BTN.textContent = n ? '式神配置 · ' + n : '式神配置';
    SHEET_BTN.classList.toggle('open', SHEET_OPEN);
    SHEET_BTN.title = (n ? '当前方案已录入 ' + n + ' 条式神配置' : '当前方案还没有录入式神配置')
      + ' · 点击' + (SHEET_OPEN ? '收起' : '展开');
  }
}
function toggleSheet(){
  SHEET_OPEN = !SHEET_OPEN;
  if(SHEET_OPEN) renderSheet();
  syncSheetToggle();
}

/* --- 启动：三层配置合并后校验渲染 --- */
(function boot(){
  // 三层：内嵌默认值 < 同目录 config.json（固化基线） < 浏览器本地改动（本地方案）
  // 只读导出（单 HTML）是自带数据的自包含文件：不能再去读旁边的 config.json，
  // 也不能读浏览器 localStorage（同源时会把原页面的方案一起带进来）—— 只认自己内嵌的那一份
  setPublished(READONLY ? null : fetchExt());
  CFG = validate(READONLY ? null : loadLocal());
  THEME = CFG.style.startTheme === 'dark' ? 'dark' : 'light';
  applyVars();
  document.getElementById('sheetAdd').onclick = addSheetRow;
  document.getElementById('sheetToggle').onclick = toggleSheet;
  const expClose = document.getElementById('expClose');
  if(expClose) expClose.onclick = closeExport;
  const expBox = document.getElementById('expBox');
  if(expBox) expBox.addEventListener('click', ev=>{ if(ev.target === expBox) closeExport(); });
  window.addEventListener('keydown', ev=>{ if(ev.key === 'Escape'){ closeExport(); closeCtx(); } });
  // 只读导出（单 HTML）：加个 ro 类，编辑面板和方案管理按钮整体让位，只留查看
  if(READONLY) document.documentElement.classList.add('ro');
  syncSheetToggle();
  // file:// 打开时（双击本地文件）主动把内联头像包挂上再渲染一次：
  // 个别浏览器在 file:// 下读不到同目录的图片子资源（节点头像会全变 ? 占位框），
  // 而 <script src> 不受这条限制（fetch / XHR 会被拦），所以走动态脚本这条路。
  if(typeof location !== 'undefined' && location.protocol === 'file:'){
    ensureAvatarPack().then(ok=>{ if(ok && window.__AV_INLINE__) rebuild(true); });
  }
  rebuild();
  if(WARN.length) console.warn('配置告警', WARN);
})();
</script>
