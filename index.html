<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>翻牌上卡导引图</title>
<style>
:root{
  --page:#FFFFFF; --panel:#F4F6F8; --text:#1F2328; --border:#D7DCE2; --line:#3679E7;
  --n-bg:#E7EBED; --n-fg:#1F2328; --n-bd:#C7CDD2;
  --e-bg:#F6DCD8; --e-fg:#7A1F16; --e-bd:#B03A2E; --e-line:#B03A2E;
  --m-bg:#DCE9F7; --m-fg:#1B3F6B; --m-bd:#2C5F9E; --m-line:#2C5F9E;
  --r-bg:#367AE7; --r-fg:#FFFFFF; --r-bd:#3679E7; --r-line:#3679E7;
  --f-bd:#3679E7; --f-line:#3679E7;
  --fs-node:15px; --fs-branch:17px; --fs-root:22px; --fs-chip:12px; --fs-badge:11px;
  --lh:1.45;
  --av-size:40px; --av-gap:6px; --av-radius:7px; --av-mb:8px;
  --nw-min:190px; --nw-max:404px; --n-padx:12px; --n-padt:9px; --n-padb:10px; --n-radius:7px;
  --chip-bg:rgba(127,127,127,.15); --badge-bg:#3679E7; --badge-fg:#FFFFFF;
  --zone-bg:rgba(127,127,127,.045); --zone-border:rgba(127,127,127,.10); --zone-radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
  background:var(--page);color:var(--text);overflow:hidden;-webkit-font-smoothing:antialiased}
#app{display:flex;flex-direction:column;height:100%}

header{flex:0 0 auto;padding:9px 16px;background:var(--panel);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:14px}
h1{font-size:15px;margin:0;font-weight:700}
.tools{margin-left:auto;display:flex;gap:8px;align-items:center}
button{font:inherit;font-size:12px;padding:5px 11px;border:1px solid var(--border);border-radius:6px;
  background:var(--page);color:var(--text);cursor:pointer}
button:hover{border-color:var(--line)}
button.on{background:var(--line);color:#fff;border-color:var(--line)}
/* 顶栏按钮：胶囊形，弱化底噪，hover / 激活态分明 */
.tools button{
  font-size:12.5px;padding:6px 15px;border-radius:999px;
  background:transparent;color:var(--text);border:1px solid var(--border);
  opacity:.72;transition:opacity .15s, background .15s, border-color .15s, color .15s;
  white-space:nowrap;line-height:1.5;
}
.tools button:hover{opacity:1;border-color:var(--line);background:rgba(127,127,127,.10)}
.tools button:active{transform:translateY(1px)}
.tools button.on{opacity:1;background:var(--line);color:#fff;border-color:var(--line)}
.tools button.on:hover{background:var(--line);opacity:.9}
/* 顶栏按钮分组：组间一条竖分隔线；成对的（只看体系 / 全部展开）做成连体分段控件 */
.tools .grp{display:flex;align-items:center;gap:8px}
.tools .sep{flex:0 0 auto;width:1px;height:18px;background:var(--border)}
.tools .grp.seg{gap:0}
.tools .grp.seg button{position:relative}
.tools .grp.seg button + button{margin-left:-1px;border-top-left-radius:0;border-bottom-left-radius:0}
.tools .grp.seg button:first-child{border-top-right-radius:0;border-bottom-right-radius:0}
.tools .grp.seg button:hover,.tools .grp.seg button.on{z-index:1}

/* 方案标签栏 */
#schemeBar{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:6px 16px;
  background:var(--panel);border-bottom:1px solid var(--border);overflow-x:auto}
.tab{font-size:12px;padding:4px 10px;border:1px solid var(--border);border-radius:14px;
  background:var(--page);color:var(--text);cursor:pointer;white-space:nowrap;
  display:inline-flex;align-items:center;gap:6px;user-select:none}
.tab:hover{border-color:var(--line)}
.tab.on{background:var(--line);color:#fff;border-color:var(--line)}
.tab.dragging{opacity:.4}
.tab.drop-l{box-shadow:-3px 0 0 0 var(--line)}
.tab.drop-r{box-shadow:3px 0 0 0 var(--line)}
.tab .x{opacity:.55;font-size:14px;line-height:1;padding:0 1px}
.tab .x:hover{opacity:1}
/* 方案来源徽标：示例随页面发布，自建只存本机浏览器 */
.pin{font-size:10px;line-height:15px;padding:0 6px;border-radius:9px;white-space:nowrap;
  background:rgba(44,95,158,.16);color:#2C5F9E;border:1px solid rgba(44,95,158,.35)}
[data-theme="dark"] .pin{background:rgba(120,170,235,.18);color:#9CC6F5;border-color:rgba(120,170,235,.4)}
.pin.loc{background:rgba(186,117,23,.16);color:#96601A;border-color:rgba(186,117,23,.4)}
[data-theme="dark"] .pin.loc{background:rgba(230,170,80,.18);color:#EDC07A;border-color:rgba(230,170,80,.4)}
.tab.on .pin{background:rgba(255,255,255,.22);color:#fff;border-color:rgba(255,255,255,.45)}
/* 方案栏右侧的操作按钮 */
.barR{margin-left:auto;display:flex;align-items:center;gap:6px;flex:0 0 auto;padding-left:10px}
.bbtn{font-size:12px;line-height:1;padding:5px 10px;cursor:pointer;border-radius:13px;
  border:1px solid var(--border);background:var(--page);color:var(--text)}
.bbtn:hover{border-color:var(--line);color:var(--line)}
.bbtn.open{border-color:var(--line);color:var(--line);background:rgba(127,127,127,.12)}

/* 切换方案时闪一下的提示（不常驻，几秒后自动消失） */
#schemeNote{position:absolute;left:50%;top:12px;z-index:40;transform:translate(-50%,-8px);
  display:none;align-items:center;gap:8px;max-width:min(680px,86vw);
  padding:7px 14px;border-radius:8px;font-size:12px;line-height:1.5;
  background:rgba(186,117,23,.14);color:var(--text);
  border:1px solid rgba(186,117,23,.45);box-shadow:0 4px 14px rgba(0,0,0,.12);
  opacity:0;transition:opacity .18s ease, transform .18s ease;pointer-events:none}
#schemeNote.on{display:flex;opacity:1;transform:translate(-50%,0)}
#schemeNote b{color:#96601A}
[data-theme="dark"] #schemeNote b{color:#EDC07A}

#stage{flex:1 1 auto;position:relative;overflow:hidden;background:var(--page);cursor:grab}
#stage.drag{cursor:grabbing}

/* --- 式神配置表（每方案一张：默认隐藏，浮在导图下沿的抽屉，不挤压画布）--- */
#sheetBar{position:absolute;left:16px;right:16px;bottom:16px;z-index:26;display:none;
  flex-direction:column;max-height:48%;background:var(--panel);
  border:1px solid var(--border);border-radius:12px;overflow:hidden;
  box-shadow:0 14px 38px rgba(0,0,0,.20), 0 2px 8px rgba(0,0,0,.10)}
#sheetBar.open{display:flex}
#side.open ~ #sheetBar{right:416px}      /* 侧栏打开时让位，别被编辑面板压住 */
#sheetHead{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:8px 14px;font-size:12.5px}
#sheetHead b{font-weight:700}
#sheetHead .cnt{font-size:11px;color:var(--text);opacity:.55;
  border:1px solid var(--border);border-radius:999px;padding:1px 8px}
#sheetHead #sheetHint{flex:1 1 auto;opacity:.5;font-size:11.5px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sheetHead button{font-size:12px;padding:4px 12px;border-radius:999px;border:1px solid var(--border);
  background:transparent;color:var(--text);cursor:pointer;white-space:nowrap}
#sheetHead button:hover{border-color:var(--line);background:rgba(127,127,127,.10)}
#sheetBody{flex:1 1 auto;overflow:auto;border-top:1px solid var(--border)}
table.sheet{border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:100%}
table.sheet th{position:sticky;top:0;z-index:1;background:var(--page);text-align:left;
  padding:6px 10px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);
  font-weight:600;white-space:nowrap}
table.sheet th:last-child{border-right:none}
table.sheet td{padding:5px 10px;border-bottom:1px solid var(--border);
  border-right:1px solid var(--border);vertical-align:middle;white-space:nowrap}
table.sheet tr:hover td{background:rgba(127,127,127,.06)}
table.sheet .no{width:38px;text-align:center;opacity:.5;font-variant-numeric:tabular-nums}
table.sheet .av{width:26px;height:26px;border-radius:5px;vertical-align:middle;margin-right:6px}
table.sheet .avm{display:inline-block;width:26px;height:26px;border-radius:5px;margin-right:6px;
  vertical-align:middle;text-align:center;line-height:26px;font-size:11px;opacity:.6;
  border:1px dashed var(--border)}
table.sheet td.edit{cursor:text}
table.sheet td.edit input{width:100%;min-width:70px;font:inherit;font-size:12.5px;
  padding:2px 4px;border:1px solid var(--line);border-radius:4px;background:var(--page);color:var(--text)}
table.sheet .del{width:32px;text-align:center;cursor:pointer;opacity:.4;font-size:14px;border-right:none}
table.sheet .del:hover{opacity:1}
#sheetEmpty{padding:16px;font-size:12.5px;line-height:1.9;opacity:.72}
#sheetEmpty kbd{font:inherit;font-size:11.5px;border:1px solid var(--border);border-radius:4px;
  padding:1px 5px;background:var(--page)}
#world{position:absolute;top:0;left:0;transform-origin:0 0}
#wires{position:absolute;top:0;left:0;overflow:visible;pointer-events:none;z-index:1}
#wires path{fill:none;stroke-linecap:round}
/* 汇合虚线走的路程长、常常要跨过别的分支，画在节点之上（z-index 3）才不会被框盖住；
   底下垫一条同色半透明的粗线当底衬，压到框上也还看得清是哪条 */
#wiresTop{position:absolute;top:0;left:0;overflow:visible;pointer-events:none;z-index:3}
#wiresTop path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.zone{position:absolute;z-index:0;pointer-events:none;
  background:var(--zone-bg);border:1px solid var(--zone-border);border-radius:var(--zone-radius)}

.node{position:absolute;z-index:2;width:max-content;min-width:var(--nw-min);max-width:var(--nw-max);
  padding:var(--n-padt) var(--n-padx) var(--n-padb);border-radius:var(--n-radius);
  border:1px solid var(--n-bd);background:var(--n-bg);color:var(--n-fg);
  font-size:var(--fs-node);line-height:var(--lh);box-shadow:0 1px 3px rgba(16,24,40,.10)}
.node:hover{box-shadow:0 2px 10px rgba(16,24,40,.18);z-index:5}
.node[data-camp="enemy"]{background:var(--e-bg);color:var(--e-fg);border-color:var(--e-bd)}
.node[data-camp="mine"]{background:var(--m-bg);color:var(--m-fg);border-color:var(--m-bd)}
.node[data-camp="root"]{background:var(--r-bg);color:var(--r-fg);border-color:var(--r-bd);
  font-size:var(--fs-root);font-weight:700;padding:14px 26px;min-width:0;max-width:none}
.node[data-camp="free"]{background:var(--page);border-style:dashed;border-color:var(--f-bd);
  font-size:var(--fs-branch);font-weight:700;min-width:0;max-width:none}
.node.clickable{cursor:pointer}
.node.sel{outline:2px solid var(--line);outline-offset:2px}
.node.ref{border-style:dashed;opacity:.92}

.avs{display:flex;flex-wrap:wrap;gap:var(--av-gap);margin:0 0 var(--av-mb)}
.av{width:var(--av-size);height:var(--av-size);border-radius:var(--av-radius);object-fit:cover;
  display:block;flex:0 0 auto;background:var(--page);border:1px solid rgba(0,0,0,.12)}
.av-miss{width:var(--av-size);height:var(--av-size);border-radius:var(--av-radius);flex:0 0 auto;
  box-sizing:border-box;border:1px dashed var(--e-bd);background:rgba(176,58,46,.10);color:var(--e-fg);
  font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:help}
.txt{word-break:break-word;text-align:left}
.node[data-camp="root"] .txt,.node[data-camp="free"] .txt{white-space:nowrap}
.yh{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{font-size:var(--fs-chip);line-height:19px;padding:0 8px;border-radius:10px;
  background:var(--chip-bg);white-space:nowrap}
.badge{position:absolute;right:-9px;top:-9px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;
  background:var(--badge-bg);color:var(--badge-fg);font-size:var(--fs-badge);line-height:20px;
  text-align:center;border:2px solid var(--page)}
/* 汇合徽标：提示这个框有几条路径汇进来（注意类名不能含 badge，布局里的 .badge 是折叠计数用的） */
.mgbadge{position:absolute;left:-9px;top:-9px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;
  background:var(--panel);color:var(--line);border:1px dashed var(--line);
  font-size:var(--fs-badge);line-height:18px;text-align:center;cursor:help}
.refmark{font-size:var(--fs-chip);opacity:.75;margin-top:4px}

/* 侧栏：配置面板 / 节点编辑 */
#side{position:absolute;top:0;right:0;bottom:0;width:400px;z-index:30;background:var(--panel);
  border-left:1px solid var(--border);display:none;flex-direction:column}
#side.open{display:flex}
#side h2{margin:0;padding:12px 14px;font-size:13px;font-weight:700;border-bottom:1px solid var(--border)}
#side h2 .nid{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;font-weight:600;
  padding:1px 7px;margin-left:2px;border:1px solid var(--border);border-radius:6px;
  background:var(--page);cursor:pointer;-webkit-user-select:text;user-select:text}
#side h2 .nid:hover{border-color:var(--line);color:var(--line)}
#side h2 .nid.ok{border-color:#3AA76D;color:#3AA76D}
#side h2 .nid.ok::after{content:' 已复制';font-size:10.5px;font-weight:400;opacity:.85}
#side h2 .sub{font-weight:400;font-size:12px;opacity:.55;margin-left:6px}
#sideBody{flex:1 1 auto;overflow:auto;padding:12px 14px}
#sideFoot{flex:0 0 auto;padding:10px 14px;border-top:1px solid var(--border);display:flex;gap:6px;flex-wrap:wrap}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12px;margin-bottom:4px;opacity:.8}
.fld input,.fld select,.fld textarea{width:100%;font:inherit;font-size:13px;padding:6px 8px;
  border:1px solid var(--border);border-radius:6px;background:var(--page);color:var(--text)}
.fld textarea{min-height:150px;font-family:ui-monospace,Consolas,monospace;font-size:12px;line-height:1.5}
.warn{background:rgba(186,117,23,.12);border:1px solid rgba(186,117,23,.4);border-radius:6px;
  padding:8px 10px;font-size:12px;line-height:1.6;margin-bottom:10px}
.warn b{display:block;margin-bottom:4px}
.warn ul{margin:0;padding-left:16px}
.hint{font-size:12px;opacity:.7;line-height:1.6}
/* 引用来源列表（共享节点：一条路径一行，✕ 只解除那一条引用） */
.refrow{display:flex;align-items:center;gap:8px;padding:5px 8px;margin-bottom:6px;
  border:1px solid var(--border);border-radius:6px;font-size:12.5px;background:var(--page)}
.refrow .rid{font-family:ui-monospace,Consolas,monospace;flex:0 0 auto;opacity:.7}
.refrow .rtl{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.refrow .rx{flex:0 0 auto;padding:0 3px;cursor:pointer;opacity:.45}
.refrow .rx:hover{opacity:1}

/* 节点右键菜单 */
#ctxMenu{position:fixed;z-index:45;display:none;min-width:156px;padding:5px;
  background:var(--panel);border:1px solid var(--border);border-radius:8px;
  box-shadow:0 8px 24px rgba(15,20,25,.2)}
#ctxMenu .mi{padding:7px 10px;border-radius:6px;font-size:13px;cursor:pointer;white-space:nowrap}
#ctxMenu .mi:hover{background:var(--zone-bg)}
#ctxMenu .mi.off{opacity:.42;cursor:not-allowed}
#ctxMenu .mi.off:hover{background:transparent}
#ctxMenu .sp{height:1px;margin:5px 6px;background:var(--border)}

/* 导出方式选择（JSON / 单 HTML / PNG） */
#expBox{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
  background:rgba(15,20,25,.45);backdrop-filter:blur(2px)}
#expBox.open{display:flex}
#expBox .ebx{width:min(560px,92vw);max-height:88vh;overflow:auto;background:var(--panel);
  border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 40px rgba(15,20,25,.28);padding:18px 18px 14px}
#expBox h3{margin:0 0 4px;font-size:15px}
#expOpts{display:flex;flex-direction:column;gap:8px;margin:14px 0 12px}
#expOpts .opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;cursor:pointer;
  padding:11px 12px;border:1px solid var(--border);border-radius:9px;background:var(--page);color:var(--text);
  font:inherit;transition:border-color .12s, box-shadow .12s}
#expOpts .opt:hover{border-color:var(--line);box-shadow:0 2px 8px rgba(15,20,25,.12)}
#expOpts .opt .ic{flex:0 0 auto;width:30px;font-size:17px;line-height:1.5;text-align:center}
#expOpts .opt .bd{flex:1 1 auto;min-width:0}
#expOpts .opt .tt{font-size:13.5px;font-weight:600;margin-bottom:2px}
#expOpts .opt .dd{font-size:12px;opacity:.72;line-height:1.55}
#expOpts .opt[disabled]{opacity:.5;cursor:default}
#expFoot{display:flex;align-items:center;gap:10px;justify-content:space-between}
#expTip{font-size:12px;opacity:.75;line-height:1.5}

/* 只读导出版（单 HTML）：隐藏编辑面板与方案管理按钮，只留查看 */
.ro #side{display:none !important}
.ro #schemeBar .barR{display:none}
.ro #sheetAdd{display:none}
.ro #sheetHint{display:none}
.ro .node{cursor:pointer}
.ro .node.sel{outline:none}
</style>
</head>
<body>
<div id="app">
  <header><h1 id="ttl">翻牌上卡导引图</h1><div class="tools" id="tools"></div></header>
  <div id="schemeBar"></div>
  <div id="stage">
    <div id="schemeNote"></div>
    <div id="world"><svg id="wires"></svg><svg id="wiresTop"></svg></div>
    <div id="side">
      <h2 id="sideTitle">配置</h2>
      <div id="sideBody"></div>
      <div id="sideFoot"></div>
    </div>
    <!-- 式神配置表：默认完全隐藏，点方案栏「式神配置」才浮出来，不占画布空间 -->
    <div id="sheetBar">
      <div id="sheetHead">
        <b>式神配置</b><span id="sheetCnt" class="cnt"></span>
        <span id="sheetHint">单元格双击编辑 · 回车保存 · 随方案一起导出 / 导入</span>
        <button id="sheetAdd">＋ 添加一行</button>
        <button id="sheetToggle">收起 ▾</button>
      </div>
      <div id="sheetBody"></div>
    </div>
  </div>
</div>

<!-- 导出方式选择：JSON（可导入）/ 单 HTML（只读）/ PNG（导图 + 式神配置） -->
<div id="expBox">
  <div class="ebx">
    <h3>导出方案：<b id="expName"></b></h3>
    <div id="expOpts"></div>
    <div id="expFoot"><span id="expTip"></span><button id="expClose">取消</button></div>
  </div>
</div>

<!-- 节点右键菜单：挂在 body 上、用 position:fixed 定位 —— 放在 #stage 里会被它的
     overflow:hidden 裁掉，画布缩放/平移也会把坐标系带歪 -->
<div id="ctxMenu"></div>

<script id="cfg-embed" type="application/json">{
 "meta": {
  "title": "翻牌上卡导引图",
  "version": 1
 },
 "ui": {
  "showHeader": true,
  "buttons": [
   {
    "id": "fit",
    "label": "适应窗口",
    "action": "view",
    "show": true,
    "group": "view"
   },
   {
    "id": "fold",
    "label": "只看体系",
    "action": "foldTop",
    "show": true,
    "group": "fold",
    "seg": true
   },
   {
    "id": "expand",
    "label": "全部展开",
    "action": "expandAll",
    "show": true,
    "group": "fold",
    "seg": true
   },
   {
    "id": "theme",
    "label": "暗色",
    "action": "toggleTheme",
    "show": true,
    "group": "theme"
   }
  ],
  "interaction": {
   "clickFold": true,
   "dblclickFocus": true,
   "wheelZoom": true,
   "dragPan": true,
   "keyboardPan": true,
   "nodeDrag": true
  },
  "clickFoldDelay": 160
 },
 "layout": {
  "rev": 1,
  "hGap": 54,
  "vGap": 13,
  "branchGap": 26,
  "groupGap": 120,
  "padX": 30,
  "padTop": 40,
  "canvasPad": 60,
  "defaultExpanded": true,
  "zoneEnabled": true,
  "sharedNodeMode": "merge",
  "sharedTitleMax": 10,
  "columnMode": "depth",
  "readableScale": 0.85,
  "minScale": 0.15,
  "maxScale": 3,
  "fitThreshold": 0.5,
  "lineWidth": 2
 },
 "style": {
  "font": {
   "node": 15,
   "branch": 17,

let PUBLISHED = [];        // 发布基线里的固化方案（由 boot / 重读配置时注入）

}

/* 视图设置（layout）的版本同步：

   一打开新版就会被它压回去（表现：复用节点还是多画一个框）。
   所以本地 layout 没有 rev、或比发布版旧时，整体换成发布版并提示一声。 */
function syncLayoutRev(cfg, raw){
  const pub = (PUB_BASE && isObj(PUB_BASE.layout)) ? PUB_BASE.layout
            : (isObj(EMBED.layout) ? EMBED.layout : null);
  if(!pub) return cfg;
  const pr = Number(pub.rev);
  const pubRev = isFinite(pr) ? pr : 0;
  const localLayout = (raw && isObj(raw.layout)) ? raw.layout : null;
  const lr = localLayout ? Number(localLayout.rev) : 0;
  const localRev = isFinite(lr) ? lr : 0;
  if(localRev >= pubRev) return cfg;                    // 本地不比发布版旧：尊重访客这份
  cfg.layout = JSON.parse(JSON.stringify(pub));

function mergePublished(cfg){

      sc.builtin = true;

      if(s.rev && s.rev === sc.rev){ s.builtin = true; out.push(s); }   // 同版本：保留本地微调
      else{
        out.push(sc);                                                   // 新出现 / 作者更新过
        if(s.rev) warn('示例导图「' + (sc.name || sc.id) + '」已随页面更新，本地改动被覆盖');
      }
    }else{
      s.builtin = false;
      out.push(s);
    }

  const news = [];
  for(const src of PUBLISHED){
    if(!src || !src.id || done[src.id]) continue;
    const sc = JSON.parse(JSON.stringify(src));
    sc.builtin = true;
    news.push(sc);
  }

  if(!cfg.schemes.some(s => s.id === cfg.activeScheme)) cfg.activeScheme = cfg.schemes[0].id;

}
function localSchemes(cfg){ return (cfg || CFG).schemes.filter(s => !s.builtin); }
/* 拖拽排序 / 导入方案时重新编号，保证 id 唯一 */
function uniqueSchemeId(base){
  const taken = {};
  for(const s of CFG.schemes) taken[s.id] = 1;
  if(!taken[base]) return base;
  for(let i = 1; ; i++) if(!taken[base + '_' + i]) return base + '_' + i;
}

  if(from === to || from < 0 || to < 0 || from >= CFG.schemes.length) return false;
  const arr = CFG.schemes;
  const sc = arr.splice(from, 1)[0];
  arr.splice(to > from ? to - 1 : to, 0, sc);

  return true;
}

// 按 SCHEMA 逐字段校验：类型不对或越界 -> 写回默认值并记告警
function applySchema(cfg){
  for(const p in SCHEMA){
    const s = SCHEMA[p], v = getPath(cfg, p);
    if(typeof v === 'number' && isFinite(v) && v >= s.min && v <= s.max) continue;
    if(v === undefined){ continue; }   // 缺失由 deepMerge 兜底，不算告警
    setPath(cfg, p, s.def);
    warn(p + ' = ' + JSON.stringify(v) + ' 不合法（应为 ' + s.min + '~' + s.max + ' 的数字），已用默认值 ' + s.def);
  }
  for(const p in ENUM){
    const v = getPath(cfg, p);
    if(v === undefined) continue;
    if(ENUM[p].indexOf(v) < 0){
      const d = ENUM[p][0];
      setPath(cfg, p, d);
      warn(p + ' = ' + JSON.stringify(v) + ' 不是合法取值（' + ENUM[p].join(' / ') + '），已用 ' + d);
    }

// 决策图校验：结构、悬空引用、环、字段类型
function validateGraph(cfg){
  if(!Array.isArray(cfg.schemes) || !cfg.schemes.length){
    cfg.schemes = [{id:'default', name:'默认方案', start:null, floating:[], nodes:{}}];
    warn('schemes 为空或不是数组，已创建空白方案');
  }
  const ids = cfg.schemes.map(s=> s && s.id);
  if(ids.indexOf(cfg.activeScheme) < 0){
    cfg.activeScheme = cfg.schemes[0].id;
    warn('activeScheme 指向不存在的方案，已切到 ' + cfg.activeScheme);
  }
  for(const sc of cfg.schemes){
    sc.builtin = sc.builtin === true;        // 固化 / 本地二选一，驱动标签栏徽标与丢失提醒
    normSheet(sc);                           // 式神御魂配置表（每方案一张，先规范化再处理节点）
    if(!isObj(sc.nodes) || !Object.keys(sc.nodes).length){
      sc.nodes = {}; const rid = sc.id + '_root';
      sc.nodes[rid] = {id:rid, title:sc.name || '未命名方案', camp:'root', hand:null, shishen:[], yuhun:[], note:'', children:[]};
      sc.start = rid; if(!Array.isArray(sc.floating)) sc.floating = [];
      warn('方案「' + (sc.name||sc.id) + '」没有节点，已生成起始节点');
      continue;
    }
    for(const id in sc.nodes){
      const n = sc.nodes[id];
      if(!isObj(n)){ delete sc.nodes[id]; warn('方案「'+sc.name+'」节点 ' + id + ' 不是对象，已移除'); continue; }
      if(n.id !== id) n.id = id;
      if(typeof n.title !== 'string' || !n.title){ n.title = id; warn('节点 ' + id + ' 缺 title，已用 id 兜底'); }
      if(['enemy','mine','neutral','root','free'].indexOf(n.camp) < 0){
        n.camp = 'neutral'; warn('节点 ' + id + ' 的 camp 不合法，已按 neutral 渲染');
      }
      if(!Array.isArray(n.shishen)){ if(n.shishen) warn('节点 '+id+' 的 shishen 不是数组，已置空'); n.shishen = []; }
      if(!Array.isArray(n.yuhun)){ if(n.yuhun) warn('节点 '+id+' 的 yuhun 不是数组，已置空'); n.yuhun = []; }
      if(typeof n.note !== 'string') n.note = '';
      // 手拖偏移量：必须是有限数字，写坏了（字符串 / NaN / Infinity）就丢掉当没拖过，
      // 绝不能让它进到布局里变成 NaN —— 整个画布会歪掉
      for(const k of ['dx','dy']){
        if(n[k] === undefined) continue;
        if(!(typeof n[k] === 'number' && isFinite(n[k]))){
          warn('节点 ' + id + ' 的 ' + k + ' 不是数字（' + JSON.stringify(n[k]) + '），已忽略');
          delete n[k];
        }else if(Math.abs(n[k]) > 20000){
          warn('节点 ' + id + ' 的 ' + k + ' 偏移量过大（' + n[k] + '），已忽略');
          delete n[k];
        }else if(n[k] === 0){ delete n[k]; }        // 0 等于没拖过，不留冗余字段
      }
      if(n.hand !== null && typeof n.hand !== 'number') n.hand = null;
      if(!Array.isArray(n.children)){ if(n.children) warn('节点 '+id+' 的 children 不是数组，已置空'); n.children = []; }
      const before = n.children.length;
      n.children = n.children.filter(c=> sc.nodes[c] !== undefined);
      if(n.children.length !== before) warn('节点 ' + id + ' 有 ' + (before-n.children.length) + ' 个子节点指向不存在的 id，已丢弃');
    }
    if(!sc.nodes[sc.start]){
      const first = Object.keys(sc.nodes)[0];
      warn('方案「'+sc.name+'」的 start 不存在，已改为第一个节点 ' + first);
      sc.start = first;
    }
    if(!Array.isArray(sc.floating)) sc.floating = [];
    sc.floating = sc.floating.filter(x=> sc.nodes[x] !== undefined);
    // 环检测：沿当前路径 DFS，回头边直接断开
    (function dfs(id, path){
      const n = sc.nodes[id]; if(!n) return;
      if(path[id]){ return true; }
      path[id] = 1;
      const keep = [];
      for(const c of n.children){
        if(path[c]){ warn('检测到环：' + id + ' -> ' + c + '，已断开该边'); continue; }
        if(dfs(c, path)) { warn('检测到环：' + id + ' -> ' + c + '，已断开该边'); continue; }
        keep.push(c);
      }
      n.children = keep;
      delete path[id];
      return false;
    })(sc.start, {});
  }
}

  const cfg = JSON.parse(JSON.stringify(deepMerge(EMBED, raw)));

  else cfg.schemes = [];
  mergePublished(cfg);                      // 固化方案以发布版为准，本地方案原样保留
  syncLayoutRev(cfg, raw);                  // 视图设置是「显示方式」，本地那份旧了就整体升级
  syncUiButtons(cfg, raw);                  // 顶栏按钮同理：旧页面存过的「编辑 / 配置」不能把新版压回去
  applySchema(cfg);
  validateGraph(cfg);
  if(!isObj(cfg.assets)) cfg.assets = {avatarIndex:{}, placeholders:{}};
  if(!isObj(cfg.assets.avatarIndex)) cfg.assets.avatarIndex = {};
  if(!isObj(cfg.assets.placeholders)) cfg.assets.placeholders = {};
  if(!isObj(cfg.aliases)) cfg.aliases = {};
  if(!Array.isArray(cfg.yuhun)) cfg.yuhun = [];
  if(!Array.isArray(cfg.ui.buttons)) cfg.ui.buttons = [];
  if(!isObj(cfg.ui.interaction)) cfg.ui.interaction = {};
  if(!Array.isArray(cfg.schemes) || !cfg.schemes.length) validateGraph(cfg);
  return cfg;
}

function saveLocal(){

  catch(e){ warn('保存到本地失败：' + e.message); return false; }
}

// 同步读取同目录下的 config.json；file:// 或不存在时返回 null，由内嵌默认值兜底
function fetchExt(){
  try{
    const xhr = new XMLHttpRequest();

/* ---------------- 2. 图层 ---------------- */
function scheme(){
  for(const s of CFG.schemes) if(s.id === CFG.activeScheme) return s;
  return CFG.schemes[0];
}
/* --- 式神御魂配置表：每个方案一张，列名可自定义，序号自动编号不存数据 --- */
const SHEET_HEADERS = ['式神','指标','御魂套装','246号位','其他要求'];
let SHEET_OPEN = false;          // 配置表默认不占地方：只有点「式神配置」才浮出来
let SHEET_BTN  = null;           // 方案栏那个「式神配置」按钮（带行数徽标）
function normSheet(sc){
  const sh = sc.sheet;
  if(!isObj(sh) || !Array.isArray(sh.headers) || !sh.headers.length){
    sc.sheet = { headers: SHEET_HEADERS.slice(), rows: [] };
    return;
  }
  sh.headers = sh.headers.map(h => String(h == null ? '' : h));
  if(!Array.isArray(sh.rows)) sh.rows = [];
  sh.rows = sh.rows
    .filter(r => Array.isArray(r))
    .map(r => { const a = r.map(v => String(v == null ? '' : v)); a.length = sh.headers.length; return a; });
}
function inDegree(sc){
  const d = {};
  for(const id in sc.nodes) for(const c of sc.nodes[id].children) d[c] = (d[c]||0)+1;
  return d;
}
let INST_SEQ = 0;
let MERGE_EDGES = [], FIRST_INST = {};     // merge 模式：记下「多出来的父节点」和每个节点的首个实例
function buildInst(sc, nodeId, deg, seen, path, depth, parentInst){
  if(!sc.nodes[nodeId]) return null;
  if(path[nodeId]) return null;                       // 环（validate 已断开，双保险）
  path[nodeId] = 1;
  seen[nodeId] = (seen[nodeId]||0) + 1;
  const n = sc.nodes[nodeId];
  const d = deg[nodeId] || 0;
  const isRef = d > 1 && seen[nodeId] > 1;
  // merge 模式：共享节点全图只画一个框，多出来的父节点改记一条汇合边（布局时补虚线箭头）
  if(isRef && CFG.layout.sharedNodeMode === 'merge'){
    if(parentInst) MERGE_EDGES.push({ from: parentInst, nid: nodeId });
    delete path[nodeId];
    return null;
  }
  const inst = {
    uid: 'i' + (++INST_SEQ), nid: nodeId, node: n, d: depth,
    deg: d, isShared: d > 1,
    collapsed: false, isRef, w:0, h:0, x:0, y:0, _y:0, el:null, children:[]
  };
  if(!FIRST_INST[nodeId]) FIRST_INST[nodeId] = inst;
  if(inst.isRef && CFG.layout.sharedNodeMode === 'collapse') inst.collapsed = true;
  for(const cid of n.children){
    const c = buildInst(sc, cid, deg, seen, path, depth+1, inst);
    if(c) inst.children.push(c);
  }
  delete path[nodeId];
  return inst;
}
function buildRoots(){
  const sc = scheme(), deg = inDegree(sc), seen = {};
  MERGE_EDGES = []; FIRST_INST = {};
  const roots = [];
  const main = buildInst(sc, sc.start, deg, seen, {}, 0, null);
  if(main) roots.push(main);
  for(const fid of sc.floating){
    const f = buildInst(sc, fid, deg, seen, {}, 0, null);
    if(f) roots.push(f);
  }
  return roots;
}
/* 汇合要补的虚线箭头：两端都得是「当前看得见」的实例（折叠起来的子树里就不画） */
function mergeEdges(){
  const out = [];
  for(const e of MERGE_EDGES){
    const a = e.from, b = FIRST_INST[e.nid];
    if(!a || !b || a === b) continue;
    if(!a.el || !b.el) continue;
    if(a.el.style.display === 'none' || b.el.style.display === 'none') continue;
    out.push([a, b]);
  }
  return out;
}

/* ---------------- 3. 布局 ---------------- */
const stage = document.getElementById('stage');
const world = document.getElementById('world');
let   svg   = document.getElementById('wires');   // rebuild() 会重建 world 内容并重新取用
let   svgTop = document.getElementById('wiresTop'); // 汇合虚线单独一层，压在节点之上
let ROOTS = [], BB = null;

function layout(){
  const L = CFG.layout;
  const padX = L.padX, padTop = L.padTop;

  function hideDeep(x){ x.el.style.display='none'; for(const c of x.children) hideDeep(c); }
  for(const r of ROOTS) (function vis(n){
    n.el.style.display='';
    if(n.collapsed){ for(const c of n.children) hideDeep(c); }
    else for(const c of n.children) vis(c);
  })(r);
  for(const r of ROOTS) (function m(n){
    n.w = n.el.offsetWidth; n.h = n.el.offsetHeight;
    if(!n.collapsed) for(const c of n.children) m(c);
  })(r);

  const groups = [];
  for(const r of ROOTS){
    const colW = [];
    (function cw(n){
      const d = CFG.layout.columnMode === 'hand' ? (n.node.hand || n.d) : n.d;
      colW[d] = Math.max(colW[d]||0, n.w);
      if(!n.collapsed) for(const c of n.children) cw(c);
    })(r);
    const colX = []; let acc = 0;
    for(let d=0; d<colW.length; d++){
      if(colW[d] === undefined) colW[d] = 0;
      colX[d] = acc; acc += colW[d] + L.hGap;
    }
    let cursor = 0;
    (function place(n){
      const d = CFG.layout.columnMode === 'hand' ? (n.node.hand || n.d) : n.d;
      const top = (n.d === 1);
      const pad = L.vGap + (top ? L.branchGap : 0);
      if(n.collapsed || !n.children.length){
        n._y = cursor; cursor += n.h + pad;
      }else{
        const before = cursor;
        n.children.forEach((c,i)=>{ if(top && i>0) cursor += L.branchGap; place(c); });
        const f = n.children[0], l = n.children[n.children.length-1];
        let y = ((f._y + f.h/2) + (l._y + l.h/2))/2 - n.h/2;
        if(y < before) y = before;
        n._y = y;
        cursor = Math.max(cursor, y + n.h + pad);
      }
      n._d = d;
    })(r);
    groups.push({root:r, colX,
      w: colX.reduce((m,x,d)=> Math.max(m, x + (colW[d]||0)), 0),
      h: Math.max(cursor - L.vGap, r.h)});
  }

  const main = groups[0], floats = groups.slice(1);
  let fx = padX, floatH = 0;
  for(const g of floats){ g.x0 = fx; g.y0 = padTop; fx += g.w + L.groupGap; floatH = Math.max(floatH, g.h); }
  main.x0 = padX;
  main.y0 = floats.length ? padTop + floatH + L.groupGap : padTop;

  let bbW = 0, bbH = 0;
  for(const g of groups) (function put(n){
    const off = nodeOffset(n.node);               // 手拖过的偏移量：人工调整优先于自动排位
    n.x = g.x0 + (g.colX[n._d]||0) + off.x;
    n.y = g.y0 + n._y + off.y;
    n.el.style.left = n.x + 'px'; n.el.style.top = n.y + 'px';
    bbW = Math.max(bbW, n.x + n.w); bbH = Math.max(bbH, n.y + n.h);
    let b = n.el.querySelector('.badge');
    if(n.children.length && n.collapsed){
      const cnt = countAll(n);
      if(!b){ b = document.createElement('span'); b.className='badge'; n.el.appendChild(b); }
      b.textContent = cnt;
    }else if(b){ b.remove(); }
    if(!n.collapsed) for(const c of n.children) put(c);
  })(g.root);

  world.querySelectorAll('.zone').forEach(e=>e.remove());
  if(L.zoneEnabled) for(const g of groups){
    const z = document.createElement('div');
    z.className='zone';
    z.style.left=(g.x0-18)+'px'; z.style.top=(g.y0-22)+'px';
    z.style.width=(g.w+36)+'px'; z.style.height=(g.h+44)+'px';
    world.appendChild(z);
  }

  const W = bbW + L.canvasPad, H = bbH + L.canvasPad;
  world.style.width=W+'px'; world.style.height=H+'px';
  svg.setAttribute('width',W); svg.setAttribute('height',H);
  // 连线：普通父子实线；汇合（同一节点被多处引用）用虚线箭头指回那唯一的框
  let p = '<defs><marker id="mAh" viewBox="0 0 10 10" refX="8.5" refY="5" ' +
          'markerWidth="5" markerHeight="5" orient="auto">' +
          '<path d="M0,0.9 L9,5 L0,9.1 L2.3,5 Z" fill="context-stroke"/></marker></defs>';
  const wireColor = b => (CFG.style.camp[b.node.camp] && CFG.style.camp[b.node.camp].line) || '#3679E7';
  const seg = (a, b, dashed)=>{
    const x1=a.x+a.w, y1=a.y+a.h/2, x2=b.x, y2=b.y+b.h/2;
    const dx = Math.max(dashed ? 46 : 26, Math.abs(x2-x1)*0.5);
    return '<path d="M'+x1+','+y1+' C'+(x1+dx)+','+y1+' '+(x2-dx)+','+y2+' '+x2+','+y2+'"' +
      ' stroke="'+wireColor(b)+'" stroke-width="'+(dashed ? Math.max(1, L.lineWidth-0.4) : L.lineWidth)+'"' +
      (dashed ? ' stroke-dasharray="7 5" marker-end="url(#mAh)"' : '') + '/>';
  };
  /* 汇合箭头专用的走线：被复用的框常常在别的深度、甚至在左边，
     直接拉一条贝塞尔会从沿途一堆框身上压过去（看着像连错了框）。
     这里改走折线：先出到「父框右侧两列之间的空档」竖着走，
     再在目标框上方（或下方）横一段，最后垂直扎进目标框的边缘。
     最后一段一定写成 L x,y 的成对坐标 —— PNG 导出要拿末尾两个数字算箭头朝向。 */
  function mergePath(a, b){
    const x1 = a.x + a.w, y1 = a.y + a.h/2;
    const bx = b.x, by = b.y + b.h/2;
    if(bx > x1 + 24){                                  // 目标就在右边：平滑曲线够短，不用绕
      const dx = Math.max(46, Math.abs(bx - x1) * 0.5);
      return 'M'+x1+','+y1+' C'+(x1+dx)+','+y1+' '+(bx-dx)+','+by+' '+bx+','+by;
    }
    const r  = Math.max(4, Math.min(12, (L.vGap || 13) / 2));
    const xg = x1 + Math.max(14, (L.hGap || 54) / 2);   // 竖直通道：父框右侧的列间空档
    const tx = bx + b.w / 2;                            // 从目标框上（或下）边缘中点扎进去
    const below = by < y1;                              // 目标在上方 -> 从它的下边缘进
    const laneY = below ? (b.y + b.h + r + 2) : (b.y - r - 2);
    const endY  = below ? (b.y + b.h) : b.y;
    const down  = laneY > y1;
    const v1 = y1 + (down ? r : -r), v2 = laneY + (down ? -r : r);
    const h1 = xg + (tx > xg ? r : -r), h2 = tx + (tx > xg ? -r : r);
    return 'M'+x1+','+y1+
           ' L'+(xg-r)+','+y1+
           ' Q'+xg+','+y1+' '+xg+','+v1+
           ' L'+xg+','+v2+
           ' Q'+xg+','+laneY+' '+h1+','+laneY+
           ' L'+h2+','+laneY+
           ' Q'+tx+','+laneY+' '+tx+','+(laneY + (below ? -r : r))+
           ' L'+tx+','+endY;
  }
  const mergeSeg = (a, b)=>{
    const d = mergePath(a, b), col = wireColor(b);
    const w = Math.max(1, L.lineWidth - 0.4);
    // 底衬：同一条路径先描一遍粗的半透明线，虚线压在框上也还认得出走向
    return '<path d="'+d+'" data-casing="1" stroke="'+col+'" stroke-opacity=".28" ' +
             'stroke-width="'+(w + 3.2)+'"/>' +
           '<path d="'+d+'" stroke="'+col+'" stroke-width="'+w+
             '" stroke-dasharray="7 5" marker-end="url(#mAh)"/>';
  };
  for(const g of groups) (function wire(n){
    if(n.collapsed) return;
    for(const c of n.children){
      p += seg(n, c, false);
      wire(c);
    }
  })(g.root);
  let pt = '';
  for(const [a, b] of mergeEdges()) pt += mergeSeg(a, b);
  svg.innerHTML = p;
  svgTop.setAttribute('width',W); svgTop.setAttribute('height',H);
  svgTop.innerHTML = pt;

  BB = {w:W, h:H};
  return BB;
}
function countAll(n){ let k=0; for(const c of n.children) k += 1 + countAll(c); return k; }

function applyVars(){
  const S = CFG.style, th = S.theme[THEME] || S.theme.light;

  r.style.setProperty('--page', th.page);

  r.style.setProperty('--nw-min', S.node.minWidth + 'px');

  r.style.setProperty('--n-padx', S.node.padX + 'px');
  r.style.setProperty('--n-padt', S.node.padTop + 'px');
  r.style.setProperty('--n-padb', S.node.padBottom + 'px');
  r.style.setProperty('--n-radius', S.node.radius + 'px');
  r.style.setProperty('--chip-bg', S.chipBg);
  r.style.setProperty('--badge-bg', S.badgeBg);
  r.style.setProperty('--badge-fg', S.badgeFg);
  r.style.setProperty('--zone-bg', S.zoneBg);
  r.style.setProperty('--zone-border', S.zoneBorder);
  r.style.setProperty('--zone-radius', S.zoneRadius + 'px');
  document.body.style.background = th.page;

/* 头像地址：优先用 __AV_INLINE__ 里内嵌的（自包含预览版），否则走配置里的相对路径 */
function avSrc(name){
  const inl = window.__AV_INLINE__;
  const v = inl && inl[name];
  return v || CFG.assets.avatarIndex[name] || '';
}
/* 同一条路径的几种写法，加载失败时依次重试（绕开不同浏览器对中文路径编码的差异） */
function avUrl(src, n){
  if(/^(data|https?|blob):/.test(src)) return src;      // data URI 无需处理
  if(n === 1) return src;                                // 中文原文，交给浏览器编码
  if(n === 2) return encodeURI(src);                     // 手动按 UTF-8 编码
  if(n === 3){ try{ return new URL(src, document.baseURI).href; }catch(e){} }
  return src;                                            // n=0：默认走原文
}
function avatarBox(names){
  const box = document.createElement('div');
  box.className = 'avs';
  for(const name of names){
    const ph = CFG.assets.placeholders[name];
    if(ph){
      const d = document.createElement('div');
      d.className='av-miss'; d.textContent = CFG.style.missing.mark || '?';
      d.title = '头像缺失：' + ph;
      box.appendChild(d);
      continue;
    }
    const src = avSrc(name);
    if(!src){
      const d = document.createElement('div');
      d.className='av-miss'; d.textContent = CFG.style.missing.mark || '?';
      d.title = '头像缺失：' + name + '（配置 avatarIndex 中没有此项）';
      box.appendChild(d);
      continue;
    }
    const im = document.createElement('img');
    im.className='av'; im.alt = name; im.title = name; im.loading='eager';
    // 中文路径交给浏览器按文档编码自己处理，不再手动 encodeURI（file:// 下手动编码容易与实际取文件的方式对不上）
    im.src = avUrl(src, 0);
    let att = 0;
    im.onerror = function(){
      // 依次换写法重试：中文原文 -> 手动编码 -> 绝对地址；都失败才退化成占位框
      if(att < 3){ att++; const u = avUrl(src, att); if(u && u !== im.src){ im.src = u; return; } }
      const d = document.createElement('div');
      d.className='av-miss'; d.textContent = CFG.style.missing.mark || '?';
      d.title = '头像加载失败：' + src + '\n实际请求：' + (im.src || '');
      im.replaceWith(d);
    };
    box.appendChild(im);
  }
  return box.children.length ? box : null;
}

function buildEl(n){
  const el = document.createElement('div');
  el.className = 'node' + (n.children.length ? ' clickable' : '');
  el.dataset.camp = n.node.camp;
  el.dataset.nid = n.nid;

  if(n.isRef && n.collapsed){
    el.classList.add('ref');
    const t = document.createElement('div');
    t.className='txt'; t.textContent = n.node.title;
    el.appendChild(t);
    const m = document.createElement('div');
    m.className='refmark';
    m.textContent = '↻ 复用：已展开于其他分支（点击展开此处副本）';
    el.appendChild(m);
  }else{
    const av = avatarBox(n.node.shishen);
    if(av) el.appendChild(av);
    // 汇合点（被 2 处以上引用）图内文字截断，保持盒子紧凑；全文放悬停提示和编辑面板
    const full = String(n.node.title == null ? '' : n.node.title);
    const maxT = CFG.layout.sharedTitleMax | 0;
    const cut = n.isShared && maxT > 0 && full.length > maxT;
    const t = document.createElement('div');
    t.className='txt'; t.textContent = cut ? full.slice(0, maxT) + '…' : full;
    if(cut) t.title = '汇合点（图上截断显示，共 ' + full.length + ' 字）\n全文：' + full;
    el.appendChild(t);
    if(n.node.yuhun.length){
      const y = document.createElement('div');
      y.className='yh';
      for(const v of n.node.yuhun){
        const c = document.createElement('span');
        c.className='chip'; c.textContent = v;
        y.appendChild(c);
      }
      el.appendChild(y);
    }
    if(n.node.note){
      const nt = document.createElement('div');
      nt.className='refmark'; nt.textContent = n.node.note;
      el.appendChild(nt);
    }
  }

  // 汇合徽标：一眼看出这个框有几条路径汇进来（其余分支各有一条虚线箭头指过来）
  if(n.isShared){
    const mb = document.createElement('span');
    mb.className = 'mgbadge'; mb.textContent = '⤵' + n.deg;
    mb.title = '汇合点：' + n.deg + ' 条路径指向同一个节点，虚线箭头来自其他分支';
    el.appendChild(mb);
  }

  // 悬停说明：把两个手势讲清楚，不然用户会拿单击去试编辑（原生 tooltip，不影响布局）
  // 只读导出（单 HTML）里没有编辑入口，提示也要跟着改成只有「收起 / 展开」
  el.title = READONLY
    ? (n.children.length ? '单击：收起 / 展开子框' : '')
    : (n.children.length
        ? '单击：收起 / 展开子框 · 双击：编辑「' + n.node.title + '」'
        : '双击：编辑「' + n.node.title + '」');

  el.__inst = n;                                    // 右键菜单要能从这个 DOM 找回实例
  // 拖框自由布局：按下先记起点，真的动了才算拖（阈值 + moved 标记，别把单击/双击吞掉）
  el.addEventListener('mousedown', ev=>{
    if(READONLY || ev.button !== 0) return;
    if(!(CFG.ui.interaction && CFG.ui.interaction.nodeDrag)) return;
    ev.stopPropagation();                           // 别让 stage 的画布平移跟着动
    ND_MOVED = false;                               // 上一次拖动如果没被 click 消掉，在这里结清
    ND = {inst: n, x0: ev.clientX, y0: ev.clientY,
          d0: nodeOffset(n.node),                   // 按下那一刻的偏移量：后面所有位移都相对它算
          moved: false};
  });

  // 单击 -> 折叠 / 展开子节点（延迟一下，避免和双击抢事件）；
  // 双击 -> 打开编辑面板。stopPropagation 是为了不让点击冒到画布被当成「点空白收起面板」
  let ct = null;
  el.addEventListener('click', ev=>{
    ev.stopPropagation();
    if(ND_MOVED){ ND_MOVED = false; return; }       // 刚才是拖动，不是单击
    if(!n.children.length) return;
    if(READONLY){ n.collapsed = !n.collapsed; layout(); syncFoldBtns(); return; }   // 只读版没有双击编辑，单击直接生效
    if(ct){ clearTimeout(ct); ct = null; return; }        // 这是双击的第一下，交给 dblclick
    ct = setTimeout(()=>{ ct = null; n.collapsed = !n.collapsed; layout(); syncFoldBtns(); }, CFG.ui.clickFoldDelay);
  });
  el.addEventListener('dblclick', ev=>{
    ev.preventDefault();
    ev.stopPropagation();
    if(READONLY) return;                                  // 只读版：双击什么都不做（编辑面板不存在）
    if(ND_MOVED){ ND_MOVED = false; return; }             // 拖动结束会带出一次点击，别当成双击
    if(ct){ clearTimeout(ct); ct = null; }                // 取消待执行的折叠
    selectNode(n, el);
  });
  return el;
}
function mount(n){
  n.el = buildEl(n);
  world.appendChild(n.el);
  for(const c of n.children){ c.parent = n; mount(c); }
}

/* ---------------- 5. UI ---------------- */
let sc_ = 1, tx = 24, ty = 24, SEL = null;
let DRAG = null;                     // 方案标签拖拽中的源下标

function applyView(){ world.style.transform = 'translate('+tx+'px,'+ty+'px) scale('+sc_+')'; }
function view(){
  const L = CFG.layout, r = BB || {w:1200,h:800};
  const W = stage.clientWidth, H = stage.clientHeight;
  const whole = Math.min(W/(r.w+40), H/(r.h+40), 1);
  if(whole >= L.fitThreshold){
    sc_ = whole;
    tx = Math.max(20,(W - r.w*sc_)/2); ty = Math.max(20,(H - r.h*sc_)/2);
  }else{
    sc_ = Math.max(Math.min(1, W/(r.w+40)), L.readableScale);
    tx = 24; ty = 24;
  }
  applyView();
}
function zoomAt(mx,my,f){
  const L = CFG.layout;
  const ns = Math.max(L.minScale, Math.min(L.maxScale, sc_*f));
  tx = mx-(mx-tx)*(ns/sc_); ty = my-(my-ty)*(ns/sc_); sc_ = ns; applyView();
}
/* 事件源位于侧栏面板或表单控件时，不当作导图操作：
   #side 就在 #stage 内部，滚轮/按键会冒泡上来；侧栏有自己的滚动区与文本输入 */
function inUI(ev){
  const t = ev && ev.target;
  if(!t || typeof t.closest !== 'function') return false;
  if(t.closest('#side') || t.closest('#sheetBar')) return true;   // 配置表抽屉里的滚动 / 点击也别传给导图
  const tag = String(t.tagName || '').toLowerCase();
  return tag === 'input' || tag === 'textarea' || tag === 'select';
}
stage.addEventListener('wheel', ev=>{
  if(!CFG.ui.interaction.wheelZoom) return;
  if(inUI(ev)) return;                    // 让侧栏内部自己滚动（头像网格 / 配置文本域）
  ev.preventDefault();
  const r = stage.getBoundingClientRect();
  zoomAt(ev.clientX-r.left, ev.clientY-r.top, ev.deltaY<0?1.12:1/1.12);
},{passive:false});
let dragging=false, sx=0, sy=0, moved=false;
/* 拖单个节点框：不推翻自动布局，只给这个节点记一组偏移量（dx/dy），
   布局算完再把偏移量叠上去 —— 新增子节点仍然自动落位，不用手摆每一个。
   位移存进 nodes 里，导出 JSON / 单 HTML / PNG 自然都带着。 */
let ND = null, ND_MOVED = false;
const NUMXY = v => (typeof v === 'number' && isFinite(v)) ? v : 0;
const NODE_DRAG_MAX = 4000;   // 手动位置的上限（px）：防手滑把框甩到画布外面找不回来
const clampOff = v => Math.max(-NODE_DRAG_MAX, Math.min(NODE_DRAG_MAX, v));
function nodeOffset(nd){ return {x: NUMXY(nd && nd.dx), y: NUMXY(nd && nd.dy)}; }
stage.addEventListener('mousedown', ev=>{
  if(inUI(ev)) return;
  if(ev.button !== 0) return;      // 右键：交给 #world 的菜单入口；这里再关一次会把刚弹出的菜单吃掉
  closeCtx();
  if(!CFG.ui.interaction.dragPan) return;
  dragging=true; moved=false; sx=ev.clientX; sy=ev.clientY; stage.classList.add('drag');
});
window.addEventListener('mousemove', ev=>{
  if(!ND) return;
  // ⚠ 位移必须相对「按下时的起点」算（ND.d0 是按下那一刻的 dx/dy），
  //   绝不能拿当前已经写回去的 dx 再加一次 —— 那样每来一个 mousemove 就重复累加，
  //   框会越拖越快、几帧就飞到画布外面去了（踩过）。
  const dx = (ev.clientX - ND.x0) / sc_, dy = (ev.clientY - ND.y0) / sc_;
  if(!ND.moved && Math.abs(dx) + Math.abs(dy) < NODE_DRAG_MIN) return;   // 手抖不算拖
  ND.moved = true; ND_MOVED = true;
  ND.inst.node.dx = Math.round(clampOff(ND.d0.x + dx));
  ND.inst.node.dy = Math.round(clampOff(ND.d0.y + dy));
  layout();                                    // 重排一次，连线和画布范围都跟着走
});
window.addEventListener('mouseup', ()=>{
  if(!ND) return;
  const did = ND.moved; ND = null;
  if(did){ ND_MOVED = true; saveLocal(); }     // 标记留给紧随其后的 click，别让它去折叠/开面板
});
window.addEventListener('mousemove', ev=>{
  if(!dragging) return;
  const dx = ev.clientX-sx, dy = ev.clientY-sy;
  if(Math.abs(dx)+Math.abs(dy) > 3) moved = true;      // 真的拖过了，松开时不当成「点空白」
  tx += dx; ty += dy; sx=ev.clientX; sy=ev.clientY; applyView();
});
window.addEventListener('mouseup', ()=>{ dragging=false; stage.classList.remove('drag'); });
/* 点画布空白处收起编辑面板（节点自身的 click 已 stopPropagation，不会被这里吃掉）
   ⚠ 「这一下是不是点在 UI 里」必须在**捕获阶段**判定完，不能等冒泡到 window 再算：
   面板里的头像格子 / 已选式神标签 / 引用来源 ✕ 都会在自己的 click 里重建 innerHTML
   （grid.innerHTML='' / now.innerHTML='' / sideBody.innerHTML=…），等冒泡上来时被点中的
   元素已脱离 #side，ev.target.closest('#side') 判不出来 → 面板被误关（点不了式神就是这个原因）。
   捕获阶段跑在目标处理器之前，那一刻 closest 还是准的，先把结论存下来。 */
function isUIEl(t){
  if(!t || typeof t.closest !== 'function') return false;
  if(t.closest('#side') || t.closest('#schemeBar') || t.closest('#expBox') || t.closest('.node')) return true;
  if(t.closest('#sheetBar')) return true;         // 在配置表里点来点去不算「点空白」
  if(t.closest('#ctxMenu')) return true;          // 右键菜单：点了菜单不该把面板收掉
  return !!t.closest('button');                   // 面板按钮常被重建，脱离后靠这层兜底
}
let CLICK_IN_UI = false;
window.addEventListener('click', ev=>{ CLICK_IN_UI = isUIEl(ev.target); }, true);
window.addEventListener('click', ev=>{
  closeCtx();                                           // 点了别处就把右键菜单收了
  if(moved){ moved=false; return; }
  if(CLICK_IN_UI) return;
  if(inUI(ev)) return;                                  // 输入框等表单元素
  if(SEL && SEL.el) SEL.el.classList.remove('sel');
  SEL = null; closeSide();
});
window.addEventListener('keydown', ev=>{
  if(!CFG.ui.interaction.keyboardPan) return;
  if(inUI(ev)) return;                    // 编辑面板里打字时不要让方向键平移导图
  const k = ev.key, st = 70;
  if(k==='ArrowLeft'){ tx+=st; applyView(); ev.preventDefault(); }
  if(k==='ArrowRight'){ tx-=st; applyView(); ev.preventDefault(); }
  if(k==='ArrowUp'){ ty+=st; applyView(); ev.preventDefault(); }
  if(k==='ArrowDown'){ ty-=st; applyView(); ev.preventDefault(); }
  if(k==='+'||k==='='){ zoomAt(stage.clientWidth/2, stage.clientHeight/2, 1.15); ev.preventDefault(); }
  if(k==='-'||k==='_'){ zoomAt(stage.clientWidth/2, stage.clientHeight/2, 1/1.15); ev.preventDefault(); }
});

const side = document.getElementById('side');
const sideTitle = document.getElementById('sideTitle');
const sideBody = document.getElementById('sideBody');
const sideFoot = document.getElementById('sideFoot');
function closeSide(){ side.classList.remove('open'); }

/* 顶栏旧的两个入口「编辑」「配置」都已彻底移除（用户确认不需要）：
   面板实现、动作表、编辑模式开关一并删掉，页面配置改由 config.json 维护后重新构建生效。 */
function footBtn(label, fn){
  const b = document.createElement('button');
  b.textContent = label; b.onclick = fn;
  sideFoot.appendChild(b);
}
function esc(s){ return String(s).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

/* --- 节点编辑（改节点字段）--- */
/* 面板标题以「节点 ID」为主（复用 / 引用都靠它认节点），后面跟一条浅色的描述做提示，点 ID 可复制 */
function copyNodeId(id, el){
  let ok = false;
  try{
    const ta = document.createElement('textarea');
    ta.value = id; ta.style.cssText = 'position:fixed;left:-9999px;top:0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    ok = !!(document.execCommand && document.execCommand('copy'));
    ta.remove();
  }catch(e){ ok = false; }
  if(!ok){ try{ navigator.clipboard.writeText(id); ok = true; }catch(e){} }
  el.classList.add('ok');
  if(el._okT) clearTimeout(el._okT);
  el._okT = setTimeout(()=>{ el.classList.remove('ok'); el._okT = null; }, 1200);
  return ok;
}
function selectNode(n, el){
  if(READONLY) return;                  // 只读导出（单 HTML）：没有编辑面板这个概念
  if(SEL && SEL.el) SEL.el.classList.remove('sel');
  SEL = n; el.classList.add('sel');
  const sc = scheme(), node = sc.nodes[n.nid];
  // 谁指向这个节点（一条路径一个父）—— 被多处引用时，删节点和「解除复用」必须分清楚
  const inRefs = id => Object.keys(sc.nodes).filter(x=> sc.nodes[x].children.indexOf(id) >= 0);
  const parents = inRefs(n.nid);
  const refs = parents.length;
  // 反向：本框「复用出去」的那些子节点（它们还挂在别的分支上）—— 汇合是从本框拉出去的虚线，
  // 所以解除复用也应该能在本框这边直接做，不用跑到被复用的那个框上去找
  const sharedOut = (node.children || []).filter(cid=> sc.nodes[cid] && inRefs(cid).length > 1);
  sideTitle.innerHTML = '编辑节点：<span class="nid" title="点击复制节点 ID（导出 / 复用 / 引用都用它）">' +
    esc(n.nid) + '</span>' +
    (refs>1 ? '<span class="sub">（' + refs + ' 处引用同步）</span>' : '') +
    '<span class="sub">' + esc(node.title) + '</span>';
  const nidEl = sideTitle.querySelector('.nid');
  if(nidEl) nidEl.onclick = ev=>{ ev.stopPropagation(); copyNodeId(n.nid, nidEl); };
  sideBody.innerHTML =
    // 引用来源只作说明，不给解除入口：解除统一在「源头那一处」（复用它的那个框）上做，
    // 免得同一件事在两头都能点、点错一侧
    (refs > 1
      ? '<div class="fld"><label>被这些分支引用（' + refs + ' 处 · 要去掉某一处，请到那一处的框上解除）</label>' +
        '<div id="ref_list"></div></div>'
      : '') +
    (sharedOut.length
      ? '<div class="fld"><label>本框复用了（' + sharedOut.length + ' 处 · 点 ✕ 只断开本框到它的引用，那个节点本身保留）</label>' +
        '<div id="outref_list"></div></div>'
      : '') +
    '<div class="fld"><label>描述</label><input id="f_title" value="'+esc(node.title)+'"></div>' +
    '<div class="fld"><label>阵营</label><select id="f_camp">' +
      ['root','mine','enemy','neutral','free'].map(c=>
        '<option value="'+c+'"'+(node.camp===c?' selected':'')+'>'+
        ({root:'中心主题',mine:'我方',enemy:'敌方',neutral:'中性/说明',free:'自由主题'}[c])+'</option>').join('') +
    '</select></div>' +
    '<div class="fld"><label>手数（可空，columnMode=hand 时按手数列）</label>' +
      '<input id="f_hand" value="'+(node.hand===null?'':node.hand)+'"></div>' +
    '<div class="fld"><label>已选式神（点标签可移除）</label><div id="ss_now"></div></div>' +
    '<div class="fld"><label>搜索并点选式神</label>' +
      '<input id="ss_q" placeholder="式神名或简称，如 阎魔 / 炎魔 / 禅吞"></div>' +
    '<div id="ss_grid"></div>' +
    '<div class="fld"><label>式神（文本，逗号分隔，支持简称）</label>' +
      '<input id="f_ss" value="'+esc(node.shishen.join('、'))+'"></div>' +
    '<div class="fld"><label>御魂 / 术语（逗号分隔）</label>' +
      '<input id="f_yh" value="'+esc(node.yuhun.join('、'))+'"></div>' +
    '<div class="fld"><label>备注</label><input id="f_note" value="'+esc(node.note)+'"></div>' +
    '<div class="hint">改完点「应用」即时重绘。</div>' +
    (sc.builtin
      ? '<div class="hint">示例导图：改动会被配置更新覆盖，想保留请先「复制」。</div>'
      : '<div class="hint">自建导图：仅存本机浏览器，建议「导出」备份。</div>');

  let curSS = node.shishen.slice();
  const fss = document.getElementById('f_ss'), q = document.getElementById('ss_q');
  const now = document.getElementById('ss_now'), grid = document.getElementById('ss_grid');
  grid.style.cssText = 'display:flex;flex-wrap:wrap;gap:8px;max-height:250px;overflow:auto';

  // 引用来源：只读说明。解除动作统一放在源头那一处（复用它的框）上，
  // 这里不给 ✕ —— 同一件事两头都能点，很容易点错一侧
  const refList = document.getElementById('ref_list');
  if(refList){
    refList.innerHTML = '';                          // 面板每次重绘都重建这块，先清一遍（DOM 桩里也是同一个对象）
    const cur = n.parent ? n.parent.nid : null;      // 当前这个框是挂在哪条路径下显示的
    parents.forEach(pid=>{
      const row = document.createElement('div');
      row.className = 'refrow';
      const a = document.createElement('span'); a.className = 'rid'; a.textContent = pid;
      const b = document.createElement('span'); b.className = 'rtl';
      b.textContent = (sc.nodes[pid] ? sc.nodes[pid].title : pid) + (pid === cur ? '（当前分支）' : '');
      b.title = b.textContent + '\n要去掉这一处，请到「' + pid + '」这个框上解除';
      row.appendChild(a); row.appendChild(b);
      refList.appendChild(row);
    });
  }

  // 反向的引用列表：本框复用出去的节点，每行 ✕ = 断开「本框 → 它」这一条（它本身留着）
  const outList = document.getElementById('outref_list');
  if(outList){
    outList.innerHTML = '';
    sharedOut.forEach(cid=>{
      const row = document.createElement('div');
      row.className = 'refrow';
      const a = document.createElement('span'); a.className = 'rid'; a.textContent = cid;
      const b = document.createElement('span'); b.className = 'rtl';
      b.textContent = (sc.nodes[cid] ? sc.nodes[cid].title : cid) + '（共 ' + inRefs(cid).length + ' 处引用）';
      b.title = b.textContent;
      const x = document.createElement('span'); x.className = 'rx'; x.textContent = '✕';
      x.title = '只解除「' + n.nid + ' → ' + cid + '」这一条引用，节点本身保留';
      x.onclick = ()=>{
        if(!confirm('解除这条复用？\n' + n.nid + '（' + node.title + '）→ ' + cid +
                    '（' + (sc.nodes[cid] ? sc.nodes[cid].title : '') + '）' +
                    '\n那个节点本身和其它引用都会保留。')) return;
        node.children = node.children.filter(c => c !== cid);
        saveLocal(); rebuild(true); reselect(n.nid);
      };
      row.appendChild(a); row.appendChild(b); row.appendChild(x);
      outList.appendChild(row);
    });
  }

  function drawNow(){
    now.innerHTML = '';
    if(!curSS.length){ now.innerHTML = '<div class="hint">未选择式神</div>'; return; }
    now.style.cssText = 'display:flex;flex-wrap:wrap;gap:6px';
    for(const nm of curSS){
      const c = document.createElement('span');
      c.className = 'chip'; c.style.cursor = 'pointer';
      c.textContent = nm + ' ×'; c.title = '点击移除';
      c.onclick = ()=>{ curSS = curSS.filter(x=> x!==nm); fss.value = curSS.join('、'); drawNow(); drawGrid(); };
      now.appendChild(c);
    }
  }
  function drawGrid(){
    const kw = (q.value || '').trim();
    const idx = CFG.assets.avatarIndex;
    const show = [];
    // 简称反查：输入「炎魔」也能找到「阎魔」
    if(kw) for(const a in CFG.aliases){
      if(a.indexOf(kw) < 0) continue;
      for(const nm of CFG.aliases[a]) if(show.indexOf(nm) < 0) show.push(nm);
    }
    for(const nm of Object.keys(idx).sort()){
      if(kw && nm.indexOf(kw) < 0) continue;
      if(show.indexOf(nm) < 0) show.push(nm);
    }
    const keepTop = grid.scrollTop;            // 重建会把滚动弹回顶部，先记下来再还原
    grid.innerHTML = show.length ? '' : '<div class="hint">没有匹配的式神</div>';
    for(const nm of show.slice(0, 80)){
      const b = document.createElement('div');
      b.style.cssText = 'width:58px;cursor:pointer;text-align:center';
      const im = document.createElement('img');
      im.src = avUrl(avSrc(nm), 0); im.title = nm; im.alt = nm;
      im.onerror = function(){ im.style.visibility = 'hidden'; };   // 加载不到就留名字，不要破图
      const on = curSS.indexOf(nm) >= 0;
      im.style.cssText = 'width:40px;height:40px;border-radius:7px;display:block;margin:0 auto;' +
        'border:2px solid ' + (on ? 'var(--line)' : 'transparent') + ';opacity:' + (on ? '1' : '.8');
      const t = document.createElement('div');
      t.style.cssText = 'font-size:10px;line-height:1.3;margin-top:2px;overflow:hidden;' +
        'text-overflow:ellipsis;white-space:nowrap';
      t.textContent = nm;
      b.appendChild(im); b.appendChild(t);
      b.onclick = ()=>{
        const i = curSS.indexOf(nm);
        if(i >= 0) curSS.splice(i, 1); else curSS.push(nm);
        fss.value = curSS.join('、'); drawNow(); drawGrid();
      };
      grid.appendChild(b);
    }
    grid.scrollTop = keepTop;
  }
  q.oninput = drawGrid;
  fss.oninput = ()=>{ curSS = expandNames(fss.value); drawNow(); drawGrid(); };
  drawNow(); drawGrid();

  sideFoot.innerHTML = '';
  footBtn('应用', ()=>{
    node.title = document.getElementById('f_title').value || n.nid;
    const camp = document.getElementById('f_camp').value;
    // 阵营取值异常时保留原值，避免写入非法 camp 影响配色与布局
    node.camp = ['root','mine','enemy','neutral','free'].indexOf(camp) >= 0 ? camp : node.camp;
    const hv = document.getElementById('f_hand').value.trim();
    node.hand = hv === '' ? null : (parseInt(hv, 10) || null);
    node.shishen = expandNames(fss.value);
    node.yuhun = splitList(document.getElementById('f_yh').value);
    node.note = document.getElementById('f_note').value;
    saveLocal(); rebuild(true); reselect(node.id);      // 保留当前视角，别把画布搬走
  });
  footBtn('＋ 新增子卡', ()=>{
    const id = newNodeId(sc);
    sc.nodes[id] = {id, title:'新节点', camp: node.camp === 'enemy' ? 'mine' : 'enemy',
                    hand: (node.hand || 0) + 1, shishen:[], yuhun:[], note:'', children:[]};
    node.children.push(id);
    saveLocal(); rebuild(true); reselect(id);
  });
  footBtn('＋ 复用已有', ()=> openPicker(node));
  // 被多处引用时这里只给「删除整个节点」：解除某一条引用统一在源头那一处（复用它的框）上做
  footBtn(refs > 1 ? '删除整个节点' : '删除节点', ()=>{
    const head = '确定删除节点「' + node.title + '」？';
    const more = refs > 1
      ? '\n它被 ' + refs + ' 处引用（' + parents.join('、') + '），删除后这些引用会一并断开。' +
        '\n只想去掉其中某一处，请到那个框（' + parents.join(' / ') + '）上点「本框复用了」里的 ✕。'
      : '\n所有指向它的引用也会一并断开。';
    if(!confirm(head + more)) return;
    for(const id in sc.nodes) sc.nodes[id].children = sc.nodes[id].children.filter(c=> c!==n.nid);
    delete sc.nodes[n.nid];
    if(sc.start === n.nid) sc.start = Object.keys(sc.nodes)[0];
    sc.floating = sc.floating.filter(x=> x!==n.nid);
    SEL = null; saveLocal(); rebuild(true); closeSide();
  });
  footBtn('关闭', ()=>{ if(SEL&&SEL.el) SEL.el.classList.remove('sel'); SEL=null; closeSide(); });
  side.classList.add('open');
}
/* ---------------- 节点右键菜单 ----------------
   编辑 / 添加子节点 / 添加同级节点 / 复位位置 / 删除节点。
   两个必须挡住的边界：根节点没有父级、被多处复用的节点有多个父级 ——
   这两种「同级插到哪儿」都说不清，直接灰掉并写明原因，不猜。 */
const ctxMenu = document.getElementById('ctxMenu');
function closeCtx(){ if(ctxMenu){ ctxMenu.style.display = 'none'; ctxMenu.innerHTML = ''; } }
function parentOf(sc, nid){
  return Object.keys(sc.nodes).filter(id=> sc.nodes[id].children.indexOf(nid) >= 0);
}
function ctxItems(n){
  const sc = scheme(), node = sc.nodes[n.nid];
  if(!node) return [];
  const pars = parentOf(sc, n.nid);
  const moved = (typeof node.dx === 'number' && node.dx) || (typeof node.dy === 'number' && node.dy);
  const it = [];
  it.push({label:'编辑', run:()=>{ selectNode(n, n.el); }});
  it.push({label:'添加子节点', run:()=>{
    const id = newNodeId(sc);
    sc.nodes[id] = {id, title:'新节点', camp: node.camp === 'enemy' ? 'mine' : 'enemy',
                    hand:(node.hand||0)+1, shishen:[], yuhun:[], note:'', children:[]};
    node.children.push(id);
    saveLocal(); rebuild(true); reselect(id);
  }});
  it.push({
    label:'添加同级节点',
    disabled: pars.length !== 1,
    tip: pars.length === 0
      ? '根节点没有同级（它的位置是整张图的起点）'
      : (pars.length > 1 ? '这个节点被 ' + pars.length + ' 处复用，同级插到哪一处不明确 —— 请先到源头那一处添加' : ''),
    run:()=>{
      const p = sc.nodes[pars[0]]; if(!p) return;
      const id = newNodeId(sc);
      sc.nodes[id] = {id, title:'新节点', camp: node.camp, hand: node.hand,
                      shishen:[], yuhun:[], note:'', children:[]};
      p.children.splice(p.children.indexOf(n.nid) + 1, 0, id);
      saveLocal(); rebuild(true); reselect(id);
    }
  });
  it.push({sep:true});
  it.push({
    label:'复位位置',
    disabled: !moved,
    tip: moved ? '把这个框放回自动排位的位置' : '这个框没有被拖动过',
    run:()=>{ delete node.dx; delete node.dy; saveLocal(); rebuild(true); reselect(n.nid); }
  });
  it.push({
    label: pars.length > 1 ? '删除整个节点' : '删除节点',
    run:()=>{
      const more = pars.length > 1
        ? '\n它被 ' + pars.length + ' 处引用（' + pars.join('、') + '），删除后这些引用会一并断开。' +
          '\n只想去掉其中某一处，请到那个框上点「本框复用了」里的 ✕。'
        : '\n所有指向它的引用也会一并断开。';
      if(!confirm('确定删除节点「' + node.title + '」？' + more)) return;
      for(const id in sc.nodes) sc.nodes[id].children = sc.nodes[id].children.filter(c=> c!==n.nid);
      delete sc.nodes[n.nid];
      if(sc.start === n.nid) sc.start = Object.keys(sc.nodes)[0];
      sc.floating = sc.floating.filter(x=> x!==n.nid);
      SEL = null; saveLocal(); rebuild(true); closeSide();
    }
  });
  return it;
}
function openCtx(n, ev){
  if(READONLY) return;
  const items = ctxItems(n);
  if(!items.length) return;
  if(ev && ev.preventDefault) ev.preventDefault();
  closeCtx();
  for(const it of items){
    if(it.sep){ const s = document.createElement('div'); s.className = 'sp'; ctxMenu.appendChild(s); continue; }
    const d = document.createElement('div');
    d.className = 'mi' + (it.disabled ? ' off' : '');
    d.textContent = it.label;
    if(it.tip) d.title = it.tip;
    if(!it.disabled) d.onclick = ev2=>{
      ev2.stopPropagation();                       // 别冒到 window 被当成「点画布空白」
      closeCtx(); it.run();
    };
    ctxMenu.appendChild(d);
  }
  // 定位：菜单是 position:fixed + 直接挂在 body 上，坐标系就是视口，不用再换算画布/缩放
  ctxMenu.style.display = 'block';
  ctxMenu.style.left = '0px'; ctxMenu.style.top = '0px';     // 先量尺寸，再摆到鼠标处
  const w = ctxMenu.offsetWidth || 160, h = ctxMenu.offsetHeight || 160;
  const mx = (ev && ev.clientX) || 0, my = (ev && ev.clientY) || 0;
  let x = mx + 4, y = my + 4;
  if(x + w > window.innerWidth - 8)  x = Math.max(8, mx - w - 8);
  if(y + h > window.innerHeight - 8) y = Math.max(8, my - h - 8);
  ctxMenu.style.left = x + 'px'; ctxMenu.style.top = y + 'px';
}

/* 打开菜单的入口：右键 mousedown 与 contextmenu 两条路都走它。
   只靠 contextmenu 不够稳（部分环境/输入方式不派发，用户看到的就是「右键没反应」），
   所以按下右键就先开；随后若浏览器再派一次 contextmenu，用时间戳吃掉，只留 preventDefault
   ——原生菜单绝不能被放出来盖住我们这一层。 */
let CTX_T = 0;
function ctxElFrom(ev){
  const t = ev.target;
  if(!t || !t.closest) return null;
  const el = t.closest('.node');
  return (el && el.__inst) ? el : null;
}
function ctxTrigger(ev){
  const el = ctxElFrom(ev);
  if(!el) return false;                               // 画布空白处右键：留给浏览器原生菜单
  if(ev.preventDefault) ev.preventDefault();
  if(READONLY) return true;
  if(Date.now() - CTX_T < 600) return true;           // 同一手势的第二发，只挡原生菜单
  CTX_T = Date.now();
  openCtx(el.__inst, ev);
  return true;
}
world.addEventListener('mousedown', ev=>{ if(ev.button === 2) ctxTrigger(ev); });
world.addEventListener('contextmenu', ctxTrigger);
// 左键按在菜单外面任何地方都收起（节点的单击会 stopPropagation，冒不到 window，所以放在捕获阶段）
document.addEventListener('mousedown', ev=>{
  if(ev.button !== 0) return;
  const t = ev.target;
  if(t && t.closest && t.closest('#ctxMenu')) return;
  closeCtx();
}, true);

function splitList(s){
  return String(s||'').split(/[,，、;；\s]+/).map(x=>x.trim()).filter(Boolean);
}
// 简称 -> 正式式神名（用配置里的 aliases 表展开）
// ⚠ 花括号不能省！写成 `if(...) for(...) if(...) push(...); else if(...) push(raw);`
//   的话，else 会粘到 for 里面那个 if 上：不在 aliases 里的名字（头像库里 276 个式神有 253 个不在）
//   会连 else 分支都进不去，被静默丢掉——表现就是「选了式神、点应用没反应」。
function expandNames(s){
  const out = [];
  for(const raw of splitList(s)){
    const hit = CFG.aliases[raw];
    if(Array.isArray(hit)){
      for(const n of hit) if(out.indexOf(n) < 0) out.push(n);
    }else if(out.indexOf(raw) < 0){
      out.push(raw);
    }
  }
  return out;
}

/* --- 顶栏按钮（由配置生成）--- */
const ACTIONS = {
  view: ()=> view(),
  foldTop: ()=>{
    // 连同子孙一起收起（不能遇到 collapsed 就停）——这样之后再点开某个框只会露出一层，
    // 可以按需一级级往下展开，而不是「一点开整棵子树全冒出来」
    for(const r of ROOTS) (function f(n,d){
      n.collapsed = d >= 1;
      for(const c of n.children) f(c, d+1);
    })(r,0);
    layout(); view(); syncFoldBtns();
  },
  /* 「全部展开」与「只看体系」是一对：一个收成骨架，一个全部摊开，都重新适配一次视图 */
  expandAll: ()=>{
    for(const r of ROOTS) (function f(n){
      n.collapsed = false;
      for(const c of n.children) f(c);
    })(r);
    layout(); view(); syncFoldBtns();
  },
  toggleTheme: (b)=>{
    THEME = (THEME === 'dark') ? 'light' : 'dark';
    b.textContent = THEME === 'dark' ? '浅色' : '暗色';
    b.classList.toggle('on', THEME === 'dark');
    applyVars();
  },
};
/* 当前折叠状态：fold = 一级以外全收着（只看体系）· expand = 全摊开 · mixed = 手工折过几处 */
function foldState(){
  let total = 0, col = 0;
  for(const r of ROOTS) (function w(n, d){
    if(d >= 1){ total++; if(n.collapsed) col++; }
    for(const c of n.children) w(c, d+1);
  })(r, 0);
  if(!total) return 'none';
  if(col === total) return 'fold';
  if(col === 0) return 'expand';
  return 'mixed';
}
/* 「只看体系 / 全部展开」是一对：哪个符合当前状态就点亮哪个，手折过之后两个都不亮 */
function syncFoldBtns(){
  const box = document.getElementById('tools');
  if(!box) return;
  const st = foldState();
  // 用 dataset 找而不是属性选择器：按钮是配置生成的，id 可能没填，找不到就当没有
  const set = (id, on)=>{
    for(const b of box.querySelectorAll('button')){
      if(b.dataset && b.dataset.id === id){ b.classList.toggle('on', !!on); return; }
    }
  };
  set('fold', st === 'fold');
  set('expand', st === 'expand');
}
function buildToolbar(){
  const box = document.getElementById('tools');
  box.innerHTML = '';
  // 页面名与浏览器标签名都取配置里的 meta.title，改配置即可改标题
  const ttl = CFG.meta.title || '导引图';
  document.getElementById('ttl').textContent = ttl;
  if(document.title !== undefined) document.title = ttl;
  // 按 group 分组：组间插一条竖分隔线；同一组里 seg 的几个渲染成连体的分段控件
  let grp = null, grpKey = null;
  for(const spec of CFG.ui.buttons){
    if(spec.show === false) continue;
    const key = spec.group || ('_' + (spec.id || ''));
    if(key !== grpKey){
      if(grp){ const s = document.createElement('span'); s.className = 'sep'; box.appendChild(s); }
      grp = document.createElement('span');
      grp.className = 'grp' + (spec.seg ? ' seg' : '');
      box.appendChild(grp);
      grpKey = key;
    }
    const b = document.createElement('button');
    b.textContent = spec.label;
    b.dataset.id = spec.id || '';
    if(spec.id === 'theme' && THEME === 'dark'){ b.textContent = '浅色'; b.classList.add('on'); }
    b.onclick = ()=>{ const fn = ACTIONS[spec.action]; if(fn) fn(b); };
    grp.appendChild(b);
  }
  syncFoldBtns();
}

/* --- 方案标签栏：切换 / 重命名 / 拖动排序 / 导出 / 导入 / 新建 --- */
function buildSchemeBar(){
  const bar = document.getElementById('schemeBar');
  bar.innerHTML = '';
  CFG.schemes.forEach((sc, idx)=>{
    const t = document.createElement('span');
    t.className = 'tab' + (sc.id === CFG.activeScheme ? ' on' : '');
    t.draggable = true;
    t.dataset.idx = idx;
    const nm = document.createElement('span');
    nm.textContent = sc.name || sc.id;
    nm.title = '拖动可排序 · 双击重命名';
    t.appendChild(nm);
    const tag = document.createElement('span');
    tag.className = 'pin' + (sc.builtin ? '' : ' loc');
    tag.textContent = sc.builtin ? '示例' : '自建';
    tag.title = sc.builtin ? '示例导图，无法删除' : '自建导图，仅存本机浏览器';
    t.appendChild(tag);
    // 拖动排序
    t.ondragstart = ev=>{
      DRAG = idx;
      t.classList.add('dragging');
      if(ev.dataTransfer){ ev.dataTransfer.effectAllowed = 'move'; try{ ev.dataTransfer.setData('text/plain', sc.id); }catch(e){} }
    };
    t.ondragend = ()=>{ DRAG = null; clearDropMark(); t.classList.remove('dragging'); };
    t.ondragover = ev=>{
      if(DRAG === null || DRAG === idx) return;
      ev.preventDefault();
      if(ev.dataTransfer) ev.dataTransfer.dropEffect = 'move';
      clearDropMark();
      const r = t.getBoundingClientRect();
      t.classList.add(ev.clientX < r.left + r.width/2 ? 'drop-l' : 'drop-r');
    };
    t.ondrop = ev=>{
      ev.preventDefault();
      const r = t.getBoundingClientRect();
      const to = ev.clientX < r.left + r.width/2 ? idx : idx + 1;
      const from = DRAG;
      clearDropMark();
      DRAG = null;
      if(from === null) return;
      if(moveScheme(from, to)) rebuild();
    };
    t.onclick = ()=>{
      if(CFG.activeScheme === sc.id){ flashNote(); return; }   // 再点当前方案也闪一下提醒
      CFG.activeScheme = sc.id; saveLocal(); rebuild(); flashNote();
    };
    t.ondblclick = (ev)=>{
      ev.preventDefault();
      const v = prompt('方案名称', sc.name || sc.id);
      if(v && v.trim()){ sc.name = v.trim(); saveLocal(); buildSchemeBar(); }
    };
    if(!sc.builtin){                       // 示例导图不给删除
      const x = document.createElement('span');
      x.className = 'x'; x.textContent = '×'; x.title = '删除该方案';
      x.onclick = (ev)=>{
        ev.stopPropagation();
        if(!confirm('删除方案「' + (sc.name || sc.id) + '」？不可撤销。')) return;
        CFG.schemes = CFG.schemes.filter(s => s.id !== sc.id);
        if(CFG.activeScheme === sc.id) CFG.activeScheme = CFG.schemes[0].id;
        saveLocal(); rebuild();
      };
      t.appendChild(x);
    }
    bar.appendChild(t);
  });

  const right = document.createElement('span');
  right.className = 'barR';
  SHEET_BTN = barBtn('式神配置', '展开 / 收起当前方案的式神御魂配置表', toggleSheet);
  right.appendChild(SHEET_BTN);
  if(!READONLY){
    right.appendChild(barBtn('＋ 新建', '新建空白方案', newScheme));
    right.appendChild(barBtn('复制', '复制当前选中的方案', copyScheme));
    right.appendChild(barBtn('导出', '导出当前方案：JSON / 单 HTML / PNG 图片', openExport));
    right.appendChild(barBtn('导入', '从 JSON 文件导入方案', importScheme));
  }
  bar.appendChild(right);
  // 提醒条不再常驻：只在切换 / 新建 / 复制 / 导入方案时由 flashNote() 闪一下
}
function barBtn(label, tip, fn){
  const b = document.createElement('button');
  b.className = 'bbtn'; b.textContent = label; b.title = tip; b.onclick = fn;
  return b;
}
function clearDropMark(){
  document.querySelectorAll('#schemeBar .tab').forEach(e=> e.classList.remove('drop-l','drop-r'));
}

/* 切换 / 新建方案时闪一下的提示：不常驻，几秒后自己消失 */
let NOTE_T = null;
const NOTE_MS = 4000;
function flashNote(){
  if(READONLY) return;                            // 只读导出里没有「本机方案」，不用闪这条提醒
  const box = document.getElementById('schemeNote');
  const loc = localSchemes();
  if(NOTE_T){ clearTimeout(NOTE_T); NOTE_T = null; }
  if(!loc.length){ box.classList.remove('on'); return; }
  box.innerHTML = '';
  const txt = document.createElement('div');
  txt.innerHTML = '⚠ 自建导图「<b>' + esc(loc.map(s => s.name || s.id).join('、')) +
    '</b>」仅存本机浏览器，清缓存即丢失，建议导出 JSON 备份。';
  box.appendChild(txt);
  box.classList.add('on');
  NOTE_T = setTimeout(()=>{ box.classList.remove('on'); NOTE_T = null; }, NOTE_MS);
}
function newSchemeId(){
  for(let i = 1; ; i++) if(!CFG.schemes.some(s => s.id === 'sc' + i)) return 'sc' + i;
}
function newScheme(){
  const v = prompt('新方案名称', '新方案');
  if(!v || !v.trim()) return;
  const id = newSchemeId(), rid = id + '_root', nodes = {};
  nodes[rid] = {id:rid, title:'我方1手', camp:'root', hand:1, shishen:[], yuhun:[], note:'', children:[]};
  CFG.schemes.push({id, name:v.trim(), builtin:false, start:rid, floating:[], nodes,
    sheet:{headers:SHEET_HEADERS.slice(), rows:[]}});
  CFG.activeScheme = id;
  saveLocal(); rebuild(); flashNote();
}
function copyScheme(){
  // 节点 id 只在方案内生效，整份深拷贝即可，无需重命名
  const src = scheme(), id = newSchemeId();
  const cp = JSON.parse(JSON.stringify(src));
  cp.id = id; cp.name = (src.name || src.id) + ' 副本';
  cp.builtin = false; delete cp.rev;        // 副本属于本地方案
  CFG.schemes.push(cp);
  CFG.activeScheme = id;
  saveLocal(); rebuild(); flashNote();
}
function newNodeId(sc){ let i = 1; while(sc.nodes['m' + i]) i++; return 'm' + i; }

/* --- 方案导出 / 导入（与页面配置解耦，各管各的）--- */
function slug(s){
  return String(s || 'scheme').replace(/[\\/:*?"<>|]+/g, '_').replace(/\s+/g, '_').slice(0, 40) || 'scheme';
}
function downloadFile(name, blob){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(()=> URL.revokeObjectURL(a.href), 4000);
}
function download(name, text){
  downloadFile(name, new Blob([text], {type: 'application/json;charset=utf-8'}));
}
/* 导出当前选中的方案：单个方案对象，可直接粘进 config.json 的 schemes 数组 */
function schemeExportJson(){
  const sc = scheme();
  if(!sc) return null;
  const out = JSON.parse(JSON.stringify(sc));
  delete out.builtin;                           // 导入方自己决定是不是固化
  return JSON.stringify(out, null, 1);
}
/* ---------------- 头像转成 data URL（导出产物要自带头像，不能依赖旁边的图片目录）---------------- */
const AV_DATA = {};                             // 名字 -> data URL（同一张图只转一次）
function avatarDataUrl(name){
  const src = avSrc(name);
  if(!src) return Promise.resolve('');
  if(/^(data|blob):/.test(src)) return Promise.resolve(src);
  if(AV_DATA[name] !== undefined) return Promise.resolve(AV_DATA[name]);
  const url = avUrl(src, document.baseURI && document.baseURI.indexOf('file:') === 0 ? 3 : 0);
  return new Promise(res=>{
    let outed = false;
    const finish = v=>{ if(outed) return; outed = true; AV_DATA[name] = v || ''; res(AV_DATA[name]); };
    try{
      if(typeof fetch !== 'function') return finish('');
      fetch(url).then(r=> r.ok ? r.blob() : Promise.reject(new Error(String(r.status))))
        .then(b=> new Promise((ok, no)=>{
          const fr = new FileReader();
          fr.onload = ()=> ok(fr.result); fr.onerror = no;
          fr.readAsDataURL(b);
        }))
        .then(d=> finish(d))
        .catch(()=> finish(''));               // file:// 下取不到就退化成占位框
    }catch(e){ finish(''); }                    // 相对路径在非浏览器环境里 fetch 会直接抛，别把 await 带崩
  });
}
/* 头像包：导出要取头像的二进制，而 file:// 下 fetch / XHR 都会被同源策略拦住，取不到就固化不进去。
   脚本标签不受这个限制，所以构建时预置一份「头像名 -> dataURL」的 JS 包（assets/avatars-inline.js），
   只在真要导出时才动态加载，平时不拖慢页面。取不到就退化到逐张 fetch（http 环境可用）。 */
const AV_PACK_SRC = 'assets/avatars-inline.js';
let AV_PACK_TRIED = false;
function ensureAvatarPack(){
  if(window.__AV_INLINE__ || AV_PACK_TRIED) return Promise.resolve(!!window.__AV_INLINE__);
  AV_PACK_TRIED = true;
  return new Promise(res=>{
    const s = document.createElement('script');
    s.src = AV_PACK_SRC;
    s.onload = ()=> res(!!window.__AV_INLINE__);
    s.onerror = ()=> res(false);              // 没有这份包（或部署时没带上它）就走 fetch 兜底
    (document.head || document.documentElement).appendChild(s);
  });
}
/* 方案里用到的所有式神：节点上的头像 + 配置表第一列 */
function schemeAvatarNames(sc){
  const set = [];
  const add = nm=>{ if(nm && set.indexOf(nm) < 0) set.push(nm); };
  for(const id in sc.nodes) for(const nm of (sc.nodes[id].shishen || [])) add(nm);
  if(sc.sheet) for(const row of sc.sheet.rows) add(sheetAvatar(row[0]));
  return set;

/* ---------------- 导出 2：单 HTML（只读查看版）----------------
   做法：拿页面自己的干净骨架（脚本开头抓的 SRC_HTML）当模板，
   ① 换掉 cfg-embed 内嵌配置的内容 —— 只留「页面配置 + 这一个方案」；
   ② 在 body 开头注入已转好的头像 data URL 和只读开关。
   产物和当前页面共用同一套渲染 / 布局代码，所以折叠展开、式神配置表的表现完全一致。 */
/* 导出用：拿「页面配置」这份（标题 / 布局 / 样式 / 别名 / 头像索引），不带方案。
   ⚠ 页面上已经没有那个配置面板了（入口和实现都删了），这个函数只为导出单 HTML 服务。 */
function pageConfigOf(cfg){
  const out = JSON.parse(JSON.stringify(cfg));
  delete out.schemes;
  delete out.activeScheme;
  return out;
}
function viewerConfig(sc){
  const base = pageConfigOf(CFG);               // 页面配置（标题 / 布局 / 样式 / 别名 / 头像索引）
  const one = JSON.parse(JSON.stringify(sc));
  one.builtin = true;                           // 当成固化方案，免得导出页还闪「仅存本机」的提醒
  base.schemes = [one];

function buildViewerHtml(sc, inlineAv){
  const cfgTxt = JSON.stringify(viewerConfig(sc)).replace(/<\//g, '<\\/');
  const oldTxt = document.getElementById('cfg-embed').textContent;
  let html = SRC_HTML;
  // 用函数形式的替换串：配置里若含 $& / $1 之类，会被 replace 当成特殊记号替换坏
  if(html.indexOf(oldTxt) >= 0) html = html.replace(oldTxt, ()=> cfgTxt);
  else return null;                             // 骨架里找不到内嵌配置，放弃（不该发生）
  const head = '<script>window.__AV_INLINE__=' + JSON.stringify(inlineAv).replace(/<\//g, '<\\/') +
               ';window.__READONLY__=1;<\/script>';
  const bi = html.indexOf('<body>');
  html = bi < 0 ? head + html : html.slice(0, bi + 6) + '\n' + head + html.slice(bi + 6);
